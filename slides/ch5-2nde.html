isplay:flex;flex-direction:column;justify-content:center;gap:38px;\">\n  <div style=\"display:inline-flex;align-self:flex-start;font-family:Kalam,cursive;font-size:28px;color:#16261f;background:#e8c468;border-radius:999px;padding:8px 26px;letter-spacing:0.04em;\">Question flash<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:62px;font-weight:700;margin:0;line-height:1.15;max-width:1580px;text-wrap:pretty;\">Un objet de masse 80 kg est posé sur la Lune (<em>g<\u002Fem><sub>Lune<\u002Fsub> = 1,6 N·kg⁻¹). Quel est son poids ? Quelle est sa masse sur la Lune ?<\u002Fh2>\n  <div data-reveal=\"1\" style=\"display:flex;gap:26px;flex-wrap:wrap;\">\n    <div style=\"border:2px solid #6bbfab;background:rgba(107,191,171,0.16);border-radius:14px;padding:26px 44px;font-size:40px;\"><em>P<\u002Fem> = 128 N ✅<\u002Fdiv>\n    <div style=\"border:2px solid #6bbfab;background:rgba(107,191,171,0.16);border-radius:14px;padding:26px 44px;font-size:40px;\"><em>m<\u002Fem> = 80 kg ✅<\u002Fdiv>\n  <\u002Fdiv>\n  <p data-reveal=\"2\" style=\"font-size:34px;line-height:1.5;margin:0;max-width:1560px;color:#c9c2b0;text-wrap:pretty;\"><em>P<\u002Fem> = <em>m<\u002Fem> × <em>g<\u002Fem> = 80 × 1,6 = <strong style=\"color:#e8c468;\">128 N<\u002Fstrong>. La masse ne dépend pas du lieu : elle reste 80 kg.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Observer · boule suspendue\" data-screen-label=\"28\" data-speaker-notes=\"Attendu : le poids (action à distance de la Terre) et l'action du fil (action de contact). Faire deviner la direction de l'action du fil avant la diapo suivante.\" style=\"background:#16261f;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:44px 70px 34px;display:flex;flex-direction:column;\">\n  <div style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;margin-bottom:10px;\">3c. Force exercée par un support ou par un fil<\u002Fdiv>\n  <div style=\"flex:1;display:flex;align-items:center;gap:70px;\">\n    <div style=\"width:640px;flex:none;\">\n      <svg id=\"deckCfObsSvg\" sc-camel-view-box=\"40 0 160 130\" style=\"width:100%;height:auto;display:block;\"><\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;gap:26px;\">\n      <div style=\"font-family:Kalam,cursive;font-size:44px;color:#e8c468;border-left:5px solid #e8c468;padding:4px 0 4px 26px;line-height:1.3;text-wrap:pretty;\">❓ Une boule est suspendue à un fil et reste immobile. Quelles actions s'exercent sur elle ?<\u002Fdiv>\n      <div data-reveal=\"1\" style=\"border:2px solid #6bbfab;background:rgba(107,191,171,0.16);border-radius:14px;padding:22px 30px;font-size:31px;line-height:1.45;text-wrap:pretty;\">Son <strong style=\"color:#e8c468;\">poids<\u002Fstrong>, action à distance exercée par la Terre.<\u002Fdiv>\n      <div data-reveal=\"2\" style=\"border:2px solid #6bbfab;background:rgba(107,191,171,0.16);border-radius:14px;padding:22px 30px;font-size:31px;line-height:1.45;text-wrap:pretty;\">L'<strong style=\"color:#e8c468;\">action du fil<\u002Fstrong>, action de contact qui la retient.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Fil et support\" data-screen-label=\"29\" data-speaker-notes=\"À copier. Le point de l'ATTENTION sera montré avec le support incliné dans l'animation suivante.\" style=\"background:#16261f;background-image:linear-gradient(rgba(242,237,225,0.09) 1px,transparent 1px),linear-gradient(90deg,rgba(242,237,225,0.09) 1px,transparent 1px);background-size:96px 96px,96px 96px;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:60px 92px;display:flex;flex-direction:column;justify-content:center;gap:26px;\">\n  <div style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;\">3c. Force exercée par un support ou par un fil<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:60px;font-weight:700;margin:0;line-height:1.1;\">L'action d'un fil ou d'un support<\u002Fh2>\n  <p style=\"font-size:32px;line-height:1.5;margin:0;max-width:1660px;text-wrap:pretty;\">Un fil qui retient le système, ou un support sur lequel il est posé, agit sur lui par une <strong>action de contact<\u002Fstrong>.<\u002Fp>\n  <div data-reveal=\"1\" style=\"border:2px solid rgba(107,191,171,0.4);background:rgba(107,191,171,0.08);border-radius:16px;padding:26px 38px;max-width:1660px;\">\n    <span style=\"display:block;font-family:Kalam,cursive;font-size:26px;color:#6bbfab;letter-spacing:0.06em;margin-bottom:10px;\">📌 À RETENIR<\u002Fspan>\n    <span style=\"font-size:32px;line-height:1.5;text-wrap:pretty;\">La force exercée par un <strong>fil<\u002Fstrong> est dirigée le long du fil, du système vers le fil. Si le système est immobile et ne subit que son poids et l'action d'un <strong>support<\u002Fstrong>, alors <span class=\"vec\"><em>F<\u002Fem><\u002Fspan><sub>support/système<\u002Fsub> = −<span class=\"vec\"><em>P<\u002Fem><\u002Fspan>.<\u002Fspan>\n  <\u002Fdiv>\n  <div data-reveal=\"2\" style=\"border:2px solid rgba(217,122,99,0.45);background:rgba(217,122,99,0.08);border-radius:14px;padding:26px 38px;max-width:1660px;\">\n    <span style=\"display:block;font-family:Kalam,cursive;font-size:26px;color:#d97a63;letter-spacing:0.06em;margin-bottom:10px;\">⚠️ ATTENTION<\u002Fspan>\n    <span style=\"font-size:32px;line-height:1.5;text-wrap:pretty;\">Sans frottement, la force exercée par le support est perpendiculaire à sa surface. Avec des frottements, ce n'est en général plus le cas, par exemple sur un support incliné.<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Anim · fil ou support\" data-screen-label=\"30\" data-speaker-notes=\"Fil : lancer l'oscillation, la flèche jaune suit toujours le fil. Support : les deux forces se compensent. Support incliné : avec frottements, la force est verticale (pas perpendiculaire) ; retirer les frottements, elle devient perpendiculaire et le bloc glisse.\" style=\"background:#16261f;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:44px 70px 34px;display:flex;flex-direction:column;\">\n  <div style=\"display:flex;align-items:baseline;gap:24px;flex-wrap:wrap;margin-bottom:14px;\">\n    <h2 style=\"font-family:Kalam,cursive;font-size:50px;font-weight:700;margin:0;\">🧵 Action d'un fil ou d'un support<\u002Fh2>\n    <span style=\"font-size:26px;color:#c9c2b0;\">Changez de situation, observez la flèche jaune.<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"flex:1;display:flex;align-items:center;gap:56px;\">\n    <div style=\"width:860px;flex:none;display:flex;flex-direction:column;gap:20px;\">\n      <div style=\"display:flex;gap:14px;flex-wrap:wrap;\">\n        <button id=\"deckCfFil\" style=\"font-family:'Space Grotesk',sans-serif;font-size:27px;background:transparent;border:2px dashed rgba(242,237,225,0.22);color:#c9c2b0;padding:12px 22px;border-radius:10px;cursor:pointer;\">Fil<\u002Fbutton>\n        <button id=\"deckCfSupport\" style=\"font-family:'Space Grotesk',sans-serif;font-size:27px;background:transparent;border:2px dashed rgba(242,237,225,0.22);color:#c9c2b0;padding:12px 22px;border-radius:10px;cursor:pointer;\">Support<\u002Fbutton>\n        <button id=\"deckCfIncline\" style=\"font-family:'Space Grotesk',sans-serif;font-size:27px;background:transparent;border:2px dashed rgba(242,237,225,0.22);color:#c9c2b0;padding:12px 22px;border-radius:10px;cursor:pointer;\">Support incliné<\u002Fbutton>\n      <\u002Fdiv>\n      <svg id=\"deckCfSvg\" sc-camel-view-box=\"0 0 240 150\" style=\"width:100%;height:auto;display:block;\"><\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;gap:22px;\">\n      <button id=\"deckCfOption\" style=\"align-self:flex-start;font-family:'Space Grotesk',sans-serif;font-size:27px;background:transparent;border:2px dashed rgba(242,237,225,0.22);color:#c9c2b0;padding:12px 24px;border-radius:10px;cursor:pointer;\">▶ Faire osciller<\u002Fbutton>\n      <div id=\"deckCfReadout\" style=\"font-size:31px;color:#c9c2b0;line-height:1.6;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Flash · vrai ou faux\" data-screen-label=\"31\" data-speaker-notes=\"Question flash vrai/faux. Faire justifier avec le support incliné de l'animation.\" style=\"background:#1d3229;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:70px 92px;display:flex;flex-direction:column;justify-content:center;gap:38px;\">\n  <div style=\"display:inline-flex;align-self:flex-start;font-family:Kalam,cursive;font-size:28px;color:#16261f;background:#e8c468;border-radius:999px;padding:8px 26px;letter-spacing:0.04em;\">Question flash · vrai ou faux ?<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:62px;font-weight:700;margin:0;line-height:1.15;max-width:1580px;text-wrap:pretty;\">En l'absence de frottement, l'action d'un support sur un système est toujours perpendiculaire au support.<\u002Fh2>\n  <div data-reveal=\"1\" style=\"display:flex;gap:26px;flex-wrap:wrap;\">\n    <div style=\"border:2px solid #6bbfab;background:rgba(107,191,171,0.16);border-radius:14px;padding:26px 44px;font-size:40px;\">Vrai ✅<\u002Fdiv>\n  <\u002Fdiv>\n  <p data-reveal=\"2\" style=\"font-size:34px;line-height:1.5;margin:0;max-width:1560px;color:#c9c2b0;text-wrap:pretty;\">Sans frottement, la force exercée par le support est perpendiculaire à sa surface. Avec frottements (support incliné par exemple), ce n'est <strong style=\"color:#e8c468;\">plus le cas<\u002Fstrong>.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Bilan\" data-screen-label=\"32\" data-speaker-notes=\"Diapo à laisser affichée pour la prise de notes, puis revenir aux objectifs.\" style=\"background:#16261f;background-image:linear-gradient(rgba(242,237,225,0.09) 1px,transparent 1px),linear-gradient(90deg,rgba(242,237,225,0.09) 1px,transparent 1px);background-size:96px 96px,96px 96px;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:56px 80px;display:flex;flex-direction:column;\">\n  <h2 style=\"font-family:Kalam,cursive;font-size:64px;font-weight:700;margin:0 0 10px;line-height:1.1;\">🗂️ Ce qu'il faut retenir<\u002Fh2>\n  <p style=\"font-size:28px;color:#c9c2b0;margin:0 0 24px;\">Cinq notions et une distinction à maîtriser.<\u002Fp>\n  <div style=\"flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:22px;\">\n    <div style=\"border:1px solid rgba(242,237,225,0.16);background:rgba(0,0,0,0.2);border-radius:14px;padding:22px 26px;display:flex;flex-direction:column;justify-content:center;gap:10px;\">\n      <div style=\"font-size:28px;color:#6bbfab;font-family:Kalam,cursive;\">Action → force<\u002Fdiv>\n      <div style=\"font-size:30px;color:#e8c468;line-height:1.3;\">un vecteur : direction, sens, valeur en N<\u002Fdiv>\n      <div style=\"font-size:25px;color:#c9c2b0;line-height:1.4;\">appliqué au point qui modélise le système ; action de contact ou à distance<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid rgba(242,237,225,0.16);background:rgba(0,0,0,0.2);border-radius:14px;padding:22px 26px;display:flex;flex-direction:column;justify-content:center;gap:10px;\">\n      <div style=\"font-size:28px;color:#6bbfab;font-family:Kalam,cursive;\">Actions réciproques<\u002Fdiv>\n      <div style=\"font-size:34px;color:#e8c468;\"><span class=\"vec\"><em>F<\u002Fem><\u002Fspan><sub style=\"font-size:20px;\">A/B<\u002Fsub> = −<span class=\"vec\"><em>F<\u002Fem><\u002Fspan><sub style=\"font-size:20px;\">B/A<\u002Fsub><\u002Fdiv>\n      <div style=\"font-size:25px;color:#c9c2b0;line-height:1.4;\">même droite d'action, sens opposés, même valeur<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid rgba(242,237,225,0.16);background:rgba(0,0,0,0.2);border-radius:14px;padding:22px 26px;display:flex;flex-direction:column;justify-content:center;gap:10px;\">\n      <div style=\"font-size:28px;color:#6bbfab;font-family:Kalam,cursive;\">Force gravitationnelle<\u002Fdiv>\n      <div style=\"font-size:34px;color:#e8c468;\"><em>F<\u002Fem> = <em>G<\u002Fem> × <span class=\"frac\"><span class=\"num\"><em>m<\u002Fem><sub>A<\u002Fsub> × <em>m<\u002Fem><sub>B<\u002Fsub><\u002Fspan><span class=\"den\"><em>d<\u002Fem>²<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:25px;color:#c9c2b0;line-height:1.4;\"><em>G<\u002Fem> = 6,67 × 10⁻¹¹ N·m²·kg⁻²<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid rgba(242,237,225,0.16);background:rgba(0,0,0,0.2);border-radius:14px;padding:22px 26px;display:flex;flex-direction:column;justify-content:center;gap:10px;\">\n      <div style=\"font-size:28px;color:#6bbfab;font-family:Kalam,cursive;\">Poids<\u002Fdiv>\n      <div style=\"font-size:34px;color:#e8c468;\"><em>P<\u002Fem> = <em>m<\u002Fem> × <em>g<\u002Fem><\u002Fdiv>\n      <div style=\"font-size:25px;color:#c9c2b0;line-height:1.4;\"><em>g<\u002Fem> dépend de l'astre (Terre 9,8 ; Mars 3,7 ; Lune 1,6 N·kg⁻¹)<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid rgba(242,237,225,0.16);background:rgba(0,0,0,0.2);border-radius:14px;padding:22px 26px;display:flex;flex-direction:column;justify-content:center;gap:10px;\">\n      <div style=\"font-size:28px;color:#6bbfab;font-family:Kalam,cursive;\">Action fil / support<\u002Fdiv>\n      <div style=\"font-size:30px;color:#e8c468;\"><span class=\"vec\"><em>F<\u002Fem><\u002Fspan><sub style=\"font-size:18px;\">support/système<\u002Fsub> = −<span class=\"vec\"><em>P<\u002Fem><\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:25px;color:#c9c2b0;line-height:1.4;\">système immobile, sans autre force ; perpendiculaire au support si pas de frottement<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid rgba(232,196,104,0.4);background:rgba(232,196,104,0.07);border-radius:14px;padding:22px 26px;display:flex;flex-direction:column;justify-content:center;gap:10px;\">\n      <div style=\"font-size:28px;color:#6bbfab;font-family:Kalam,cursive;\">🔧 Comparer poids et masse<\u002Fdiv>\n      <div style=\"font-size:25px;line-height:1.45;\">La <strong style=\"color:#e8c468;\">masse<\u002Fstrong> est la même partout.<br>Le <strong style=\"color:#e8c468;\">poids<\u002Fstrong> dépend de <em>g<\u002Fem>, donc du lieu.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this.armReveals();\n    this.watchAnimations();\n  }\n\n  armReveals() {\n    document.querySelectorAll(\"[data-reveal]\").forEach((el) => {\n      if (el.getAttribute(\"data-revealed\") === \"1\") return;\n      el.style.opacity = \"0\";\n      el.style.transform = \"translateY(10px)\";\n      el.style.transition = \"opacity .32s ease, transform .32s ease\";\n    });\n    if (this._revealBound) return;\n    this._revealBound = true;\n    window.addEventListener(\"keydown\", this.onRevealKey.bind(this), true);\n  }\n\n  onRevealKey(e) {\n    const t = e.composedPath ? e.composedPath()[0] : e.target;\n    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;\n    if (e.metaKey || e.ctrlKey || e.altKey) return;\n    const fwd = [\"ArrowRight\", \"PageDown\", \" \", \"Spacebar\", \"ArrowDown\"].indexOf(e.key) > -1;\n    const back = [\"ArrowLeft\", \"PageUp\", \"ArrowUp\"].indexOf(e.key) > -1;\n    if (!fwd && !back) return;\n    const slide = document.querySelector(\"[data-deck-active]\");\n    if (!slide) return;\n    const items = Array.prototype.slice.call(slide.querySelectorAll(\"[data-reveal]\"));\n    if (!items.length) return;\n    const group = (el) => el.getAttribute(\"data-reveal\");\n    const shown = (el) => el.getAttribute(\"data-revealed\") === \"1\";\n    if (fwd) {\n      const next = items.filter((el) => !shown(el))[0];\n      if (!next) return;\n      const g = group(next);\n      items.filter((el) => group(el) === g).forEach((el) => {\n        el.setAttribute(\"data-revealed\", \"1\");\n        el.style.opacity = \"1\";\n        el.style.transform = \"none\";\n      });\n    } else {\n      const on = items.filter(shown);\n      if (!on.length) return;\n      const g = group(on[on.length - 1]);\n      items.filter((el) => group(el) === g).forEach((el) => {\n        el.removeAttribute(\"data-revealed\");\n        el.style.opacity = \"0\";\n        el.style.transform = \"translateY(10px)\";\n      });\n    }\n    e.preventDefault();\n    e.stopImmediatePropagation();\n  }\n\n  /* deck-stage peut remonter le DOM d'une diapo : tout SVG vide est ré-initialisé. */\n  watchAnimations() {\n    if (this._watching) return;\n    this._watching = true;\n    const specs = [\n      [\"deckFvSvg\", { deckFvF: 400 }, () => initForceVector({ svgId: \"deckFvSvg\", readoutId: \"deckFvReadout\", btnStep1Id: \"deckFvS1\", btnStep2Id: \"deckFvS2\", btnStep3Id: \"deckFvS3\", btnFlipId: \"deckFvFlip\", fRangeId: \"deckFvF\" })],\n      [\"deckParaSvg\", {}, () => ch5DrawParachute(\"deckParaSvg\")],\n      [\"deckSysSvg\", {}, () => ch5DrawSkydiver(\"deckSysSvg\")],\n      [\"deckBikeSvg\", {}, () => ch5DrawBikes(\"deckBikeSvg\")],\n      [\"deckRaObsSvg\", {}, () => initReciprocalActions({ svgId: \"deckRaObsSvg\", mode: \"contact\", hideForces: true })],\n      [\"deckRaSvg\", { deckRaM: 1000 }, () => initReciprocalActions({ svgId: \"deckRaSvg\", readoutId: \"deckRaReadout\", btnContactId: \"deckRaContact\", btnDistanceId: \"deckRaDistance\", massRangeId: \"deckRaM\", massWrapId: \"deckRaMWrap\" })],\n      [\"deckGfSvg\", { deckGfMA: 6, deckGfMB: 1, deckGfD: 10 }, () => initGravitationalForce({ svgId: \"deckGfSvg\", mARangeId: \"deckGfMA\", mBRangeId: \"deckGfMB\", dRangeId: \"deckGfD\", readoutId: \"deckGfReadout\" })],\n      [\"deckWcSvg\", { deckWcM: 80 }, () => initWeightCalculator({ svgId: \"deckWcSvg\", mRangeId: \"deckWcM\", readoutId: \"deckWcReadout\", btnTerreId: \"deckWcTerre\", btnMarsId: \"deckWcMars\", btnLuneId: \"deckWcLune\" })],\n      [\"deckCfObsSvg\", {}, () => initContactForce({ svgId: \"deckCfObsSvg\", mode: \"fil\", hideForces: true })],\n      [\"deckCfSvg\", {}, () => initContactForce({ svgId: \"deckCfSvg\", readoutId: \"deckCfReadout\", btnFilId: \"deckCfFil\", btnSupportId: \"deckCfSupport\", btnInclineId: \"deckCfIncline\", btnOptionId: \"deckCfOption\" })]\n    ];\n    const tick = () => {\n      if (typeof window.initContactForce !== \"function\") return;\n      document.querySelectorAll(\"[data-reveal]\").forEach((el) => {\n        if (el.getAttribute(\"data-revealed\") === \"1\" || el.style.opacity === \"0\") return;\n        el.style.opacity = \"0\";\n        el.style.transform = \"translateY(10px)\";\n        el.style.transition = \"opacity .32s ease, transform .32s ease\";\n      });\n      specs.forEach(([id, start, init]) => {\n        const svg = document.getElementById(id);\n        if (!svg || svg.innerHTML.length) return;\n        Object.keys(start).forEach((k) => {\n          const el = document.getElementById(k);\n          if (el && !el.dataset.userSet) {\n            el.value = start[k];\n            el.addEventListener(\"input\", () => { el.dataset.userSet = \"1\"; }, { once: true });\n          }\n        });\n        try { init(); } catch (e) { /* diapo pas encore prête */ }\n      });\n    };\n    setTimeout(tick, 50);\n    setInterval(tick, 400);\n  }\n\n  renderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
