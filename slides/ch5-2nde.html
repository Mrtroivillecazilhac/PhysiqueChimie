  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ver{color:#f2ede1;}\n  input[type=range]{accent-color:#e8c468;}\n  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 0.25em;}\n  .frac .num{border-bottom:2px solid currentColor;padding:0 0.35em 0.12em;}\n  .frac .den{padding:0.12em 0.35em 0;}\n  .vec{position:relative;display:inline-block;padding-top:0.36em;line-height:1;}\n  .vec::before{content:\"\";position:absolute;top:0.08em;left:0.02em;right:0.16em;border-top:0.075em solid currentColor;}\n  .vec::after{content:\"\";position:absolute;top:-0.035em;right:-0.04em;width:0;height:0;border-style:solid;border-width:0.15em 0 0.15em 0.24em;border-color:transparent transparent transparent currentColor;}\n<\u002Fstyle>\n<script src=\"97727ab0-02fa-4af1-b33f-52f1124c6d05\"><\u002Fscript>\n<script src=\"a2eb4026-065d-4be5-b0d8-6f95f2adbc62\"><\u002Fscript>\n<script src=\"160f4436-c044-4951-9edb-d8d6a8b983fd\"><\u002Fscript>\n<script>\n(function () {\n  if (window.__ch5SecondeRetry) return;\n  window.__ch5SecondeRetry = true;\n  var q = location.search || \"\";\n  if (!q) return;\n  var checks = [\n    [\"support.js\", function () { return typeof DCLogic !== \"undefined\"; }],\n    [\"animations-common.js\", function () { return typeof generateDotsInEllipse === \"function\"; }],\n    [\"animations-ch5-2nde.js\", function () { return typeof initContactForce === \"function\"; }],\n    [\"deck-stage.js\", function () { return !!customElements.get(\"deck-stage\"); }]\n  ];\n  function step(i) {\n    if (i >= checks.length) return;\n    var name = checks[i][0], ok = checks[i][1];\n    var done = function () { step(i + 1); };\n    var already = false;\n    try { already = ok(); } catch (e) { already = false; }\n    if (already) return done();\n    var s = document.createElement(\"script\");\n    s.src = name + q;\n    s.onload = done;\n    s.onerror = done;\n    document.head.appendChild(s);\n  }\n  setTimeout(function () { step(0); }, 0);\n})();\n<\u002Fscript>\n<\u002Fhelmet>\n\n<x-import component-from-global-scope=\"deck-stage\" from=\"160f4436-c044-4951-9edb-d8d6a8b983fd#/deck-stage.js\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\">\n\n<section data-label=\"Titre\" data-screen-label=\"01\" data-speaker-notes=\"Annoncer le fil du chapitre : deux systèmes en interaction exercent l'un sur l'autre des forces opposées ; on apprend ensuite à modéliser trois actions courantes : la gravitation, le poids, l'action d'un fil ou d'un support.\" style=\"background:#16261f;background-image:linear-gradient(rgba(242,237,225,0.09) 1px,transparent 1px),linear-gradient(90deg,rgba(242,237,225,0.09) 1px,transparent 1px);background-size:96px 96px,96px 96px;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:90px 110px;display:flex;flex-direction:column;justify-content:center;gap:34px;\">\n  <div style=\"display:inline-flex;align-self:flex-start;font-family:Kalam,cursive;font-size:30px;color:#16261f;background:#6bbfab;border-radius:999px;padding:8px 28px;letter-spacing:0.04em;\">Physique-chimie · 2nde<\u002Fdiv>\n  <div style=\"font-family:Kalam,cursive;font-size:40px;color:#e8c468;\">Chapitre 5<\u002Fdiv>\n  <h1 style=\"font-family:Kalam,cursive;font-weight:700;font-size:104px;line-height:1.05;margin:0;max-width:1560px;text-wrap:pretty;\">Modéliser une action mécanique sur un système<\u002Fh1>\n  <div style=\"width:220px;height:4px;background:rgba(242,237,225,0.28);\"><\u002Fdiv>\n  <p style=\"font-size:34px;color:#c9c2b0;margin:0;max-width:1300px;\">Actions réciproques, interaction gravitationnelle, poids, action d'un fil ou d'un support.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Objectifs\" data-screen-label=\"02\" data-speaker-notes=\"Les quatre compétences évaluables du chapitre. Y revenir sur la diapo bilan.\" style=\"background:#16261f;background-image:linear-gradient(rgba(242,237,225,0.09) 1px,transparent 1px),linear-gradient(90deg,rgba(242,237,225,0.09) 1px,transparent 1px);background-size:96px 96px,96px 96px;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:70px 92px;display:flex;flex-direction:column;\">\n  <div style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;margin-bottom:6px;\">Ce qu'il faudra savoir faire<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:64px;font-weight:700;margin:0 0 44px;line-height:1.1;\">🎯 Objectifs du chapitre<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:20px;max-width:1560px;\">\n    <div data-reveal=\"1\" style=\"display:flex;gap:28px;align-items:flex-start;border:2px solid rgba(107,191,171,0.35);background:rgba(107,191,171,0.07);border-radius:16px;padding:24px 36px;\">\n      <span style=\"font-family:Kalam,cursive;font-size:46px;color:#6bbfab;line-height:1;\">1<\u002Fspan>\n      <span style=\"font-size:33px;line-height:1.45;text-wrap:pretty;\">Modéliser une action mécanique par une force et distinguer action de contact et action à distance.<\u002Fspan>\n    <\u002Fdiv>\n    <div data-reveal=\"2\" style=\"display:flex;gap:28px;align-items:flex-start;border:2px solid rgba(107,191,171,0.35);background:rgba(107,191,171,0.07);border-radius:16px;padding:24px 36px;\">\n      <span style=\"font-family:Kalam,cursive;font-size:46px;color:#6bbfab;line-height:1;\">2<\u002Fspan>\n      <span style=\"font-size:33px;line-height:1.45;text-wrap:pretty;\">Connaître le principe des actions réciproques.<\u002Fspan>\n    <\u002Fdiv>\n    <div data-reveal=\"3\" style=\"display:flex;gap:28px;align-items:flex-start;border:2px solid rgba(107,191,171,0.35);background:rgba(107,191,171,0.07);border-radius:16px;padding:24px 36px;\">\n      <span style=\"font-family:Kalam,cursive;font-size:46px;color:#6bbfab;line-height:1;\">3<\u002Fspan>\n      <span style=\"font-size:33px;line-height:1.45;text-wrap:pretty;\">Savoir calculer une force d'interaction gravitationnelle et un poids.<\u002Fspan>\n    <\u002Fdiv>\n    <div data-reveal=\"4\" style=\"display:flex;gap:28px;align-items:flex-start;border:2px solid rgba(107,191,171,0.35);background:rgba(107,191,171,0.07);border-radius:16px;padding:24px 36px;\">\n      <span style=\"font-family:Kalam,cursive;font-size:46px;color:#6bbfab;line-height:1;\">4<\u002Fspan>\n      <span style=\"font-size:33px;line-height:1.45;text-wrap:pretty;\">Savoir modéliser l'action d'un fil ou d'un support.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"§ Action mécanique et force\" data-screen-label=\"03\" data-speaker-notes=\"Partie 1. Avant d'étudier des forces particulières, on apprend à délimiter le système et à représenter une action par un vecteur.\" style=\"background:#1d3229;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:70px 92px;display:flex;flex-direction:column;justify-content:center;gap:22px;\">\n  <div style=\"font-family:Kalam,cursive;font-size:190px;color:rgba(232,196,104,0.22);line-height:0.9;\">1<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:82px;font-weight:700;margin:0;line-height:1.1;\">Modéliser une action par une force<\u002Fh2>\n  <p style=\"font-size:36px;color:#c9c2b0;margin:0;max-width:1300px;\">Qui agit sur quoi, et comment le représenter ?<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Observer · parachutiste\" data-screen-label=\"04\" data-speaker-notes=\"Faire désigner le système avant de dévoiler le contour pointillé. Puis faire lister ce qui l'entoure : l'air, la Terre… Tout cela, c'est l'extérieur.\" style=\"background:#16261f;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:44px 70px 34px;display:flex;flex-direction:column;\">\n  <div style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;margin-bottom:10px;\">1. Système étudié et extérieur<\u002Fdiv>\n  <div style=\"flex:1;display:flex;align-items:center;gap:64px;\">\n    <div style=\"width:780px;flex:none;position:relative;border:1px solid rgba(242,237,225,0.16);background:rgba(0,0,0,0.22);border-radius:16px;overflow:hidden;\">\n      <svg id=\"deckSysSvg\" sc-camel-view-box=\"0 0 240 170\" style=\"width:100%;height:auto;display:block;\"><\u002Fsvg>\n      <svg data-reveal=\"1\" sc-camel-view-box=\"0 0 240 170\" style=\"position:absolute;inset:0;width:100%;height:100%;\">\n        <ellipse cx=\"128\" cy=\"66\" rx=\"58\" ry=\"38\" fill=\"rgba(232,196,104,0.06)\" stroke=\"#e8c468\" stroke-width=\"1.8\" stroke-dasharray=\"5,3\"><\u002Fellipse>\n        <text x=\"128\" y=\"118\" font-size=\"13\" font-family=\"Kalam,cursive\" fill=\"#e8c468\" text-anchor=\"middle\">système<\u002Ftext>\n      <\u002Fsvg>\n      <svg data-reveal=\"2\" sc-camel-view-box=\"0 0 240 170\" style=\"position:absolute;inset:0;width:100%;height:100%;\">\n        <text x=\"8\" y=\"14\" font-size=\"13\" font-family=\"Kalam,cursive\" fill=\"#f2ede1\">extérieur<\u002Ftext>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;gap:26px;\">\n      <div style=\"font-family:Kalam,cursive;font-size:44px;color:#e8c468;border-left:5px solid #e8c468;padding:4px 0 4px 26px;line-height:1.3;text-wrap:pretty;\">❓ On étudie le parachutiste. Qu'est-ce qui constitue le système ? Et l'extérieur ?<\u002Fdiv>\n      <div data-reveal=\"1\" style=\"border:2px solid #6bbfab;background:rgba(107,191,171,0.16);border-radius:14px;padding:22px 30px;font-size:31px;line-height:1.45;text-wrap:pretty;\">Le système étudié est <strong style=\"color:#e8c468;\">le parachutiste et son équipement<\u002Fstrong>.<\u002Fdiv>\n      <div data-reveal=\"2\" style=\"border:2px solid #6bbfab;background:rgba(107,191,171,0.16);border-radius:14px;padding:22px 30px;font-size:31px;line-height:1.45;text-wrap:pretty;\">L'air, la Terre et tout ce qui n'appartient pas au système forment <strong style=\"color:#e8c468;\">l'extérieur<\u002Fstrong>.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Déf · système et extérieur\" data-screen-label=\"05\" data-speaker-notes=\"À copier. Le point qui modélise le système sera le point d'application des forces.\" style=\"background:#16261f;background-image:linear-gradient(rgba(242,237,225,0.09) 1px,transparent 1px),linear-gradient(90deg,rgba(242,237,225,0.09) 1px,transparent 1px);background-size:96px 96px,96px 96px;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:70px 92px;display:flex;flex-direction:column;justify-content:center;gap:30px;\">\n  <div style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;\">1. Système étudié et extérieur<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:60px;font-weight:700;margin:0;line-height:1.1;\">Le système et l'extérieur<\u002Fh2>\n  <div style=\"display:inline-flex;align-self:flex-start;font-family:Kalam,cursive;font-size:28px;color:#16261f;background:#6bbfab;border-radius:999px;padding:8px 26px;letter-spacing:0.04em;\">✍️ À copier dans le cahier<\u002Fdiv>\n  <div style=\"border:2px solid rgba(232,196,104,0.45);background:rgba(232,196,104,0.07);border-radius:16px;padding:28px 38px;max-width:1660px;\">\n    <span style=\"display:block;font-family:Kalam,cursive;font-size:26px;color:#e8c468;letter-spacing:0.06em;margin-bottom:12px;\">📘 DÉFINITION<\u002Fspan>\n    <span style=\"display:block;font-size:33px;line-height:1.45;text-wrap:pretty;\">Le <strong>système<\u002Fstrong> est l'objet, ou l'ensemble d'objets, que l'on choisit d'étudier. Tout ce qui n'en fait pas partie forme l'<strong>extérieur<\u002Fstrong>.<\u002Fspan>\n  <\u002Fdiv>\n  <div data-reveal=\"1\" style=\"border:2px solid rgba(107,191,171,0.4);background:rgba(107,191,171,0.08);border-radius:16px;padding:26px 38px;max-width:1660px;\">\n    <span style=\"display:block;font-family:Kalam,cursive;font-size:26px;color:#6bbfab;letter-spacing:0.06em;margin-bottom:10px;\">📌 À RETENIR<\u002Fspan>\n    <span style=\"font-size:32px;line-height:1.5;text-wrap:pretty;\">Pour simplifier, on représente le système par un <strong>point<\u002Fstrong>.<\u002Fspan>\n  <\u002Fdiv>\n  <p data-reveal=\"2\" style=\"font-size:32px;line-height:1.5;margin:0;max-width:1660px;text-wrap:pretty;\">L'extérieur peut agir de plusieurs façons sur le système : ce sont des <strong style=\"color:#e8c468;\">actions mécaniques<\u002Fstrong>.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Déf · action mécanique\" data-screen-label=\"06\" data-speaker-notes=\"À copier. Faire le lien avec le vecteur déplacement du chapitre 4 : mêmes trois caractéristiques. La norme dépend de l'échelle choisie.\" style=\"background:#16261f;background-image:linear-gradient(rgba(242,237,225,0.09) 1px,transparent 1px),linear-gradient(90deg,rgba(242,237,225,0.09) 1px,transparent 1px);background-size:96px 96px,96px 96px;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:64px 92px;display:flex;flex-direction:column;justify-content:center;gap:28px;\">\n  <div style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;\">1a. Action mécanique<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:60px;font-weight:700;margin:0;line-height:1.1;\">Une action, une force, un vecteur<\u002Fh2>\n  <div style=\"display:inline-flex;align-self:flex-start;font-family:Kalam,cursive;font-size:28px;color:#16261f;background:#6bbfab;border-radius:999px;padding:8px 26px;letter-spacing:0.04em;\">✍️ À copier dans le cahier<\u002Fdiv>\n  <div style=\"border:2px solid rgba(232,196,104,0.45);background:rgba(232,196,104,0.07);border-radius:16px;padding:28px 38px;max-width:1660px;\">\n    <span style=\"display:block;font-family:Kalam,cursive;font-size:26px;color:#e8c468;letter-spacing:0.06em;margin-bottom:12px;\">📘 DÉFINITION<\u002Fspan>\n    <span style=\"display:block;font-size:33px;line-height:1.45;text-wrap:pretty;\">Toute <strong>action mécanique<\u002Fstrong> de l'extérieur sur le système se modélise par une <strong>force<\u002Fstrong>. On représente cette force par un <strong>vecteur<\u002Fstrong>, défini par :<\u002Fspan>\n  <\u002Fdiv>\n  <div data-reveal=\"1\" style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;max-width:1660px;\">\n    <div style=\"border:1px solid rgba(242,237,225,0.16);background:rgba(0,0,0,0.22);border-radius:14px;padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;\">une direction<\u002Fspan><span style=\"font-size:30px;line-height:1.4;\">la droite le long de laquelle la force agit : sa droite d'action<\u002Fspan><\u002Fdiv>\n    <div style=\"border:1px solid rgba(242,237,225,0.16);background:rgba(0,0,0,0.22);border-radius:14px;padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;\">un sens<\u002Fspan><span style=\"font-size:30px;line-height:1.4;\">l'orientation de la force sur cette droite<\u002Fspan><\u002Fdiv>\n    <div style=\"border:1px solid rgba(242,237,225,0.16);background:rgba(0,0,0,0.22);border-radius:14px;padding:22px 28px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;\">une norme<\u002Fspan><span style=\"font-size:30px;line-height:1.4;\">une longueur proportionnelle à la valeur de la force, en <strong style=\"color:#e8c468;\">newton (N)<\u002Fstrong><\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Anim · vecteur force\" data-screen-label=\"07\" data-speaker-notes=\"Construire le vecteur étape par étape, dans l'ordre : direction, sens, norme. Faire varier la valeur : la longueur suit l'échelle. Inverser le sens : même direction, sens opposé.\" style=\"background:#16261f;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:44px 70px 34px;display:flex;flex-direction:column;\">\n  <div style=\"display:flex;align-items:baseline;gap:24px;flex-wrap:wrap;margin-bottom:14px;\">\n    <h2 style=\"font-family:Kalam,cursive;font-size:50px;font-weight:700;margin:0;\">📐 Construire le vecteur force<\u002Fh2>\n    <span style=\"font-size:26px;color:#c9c2b0;\">Direction, puis sens, puis norme.<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"flex:1;display:flex;align-items:center;gap:56px;\">\n    <div style=\"width:860px;flex:none;display:flex;flex-direction:column;gap:20px;\">\n      <div style=\"display:flex;gap:14px;flex-wrap:wrap;\">\n        <button id=\"deckFvS1\" style=\"font-family:'Space Grotesk',sans-serif;font-size:27px;background:transparent;border:2px dashed rgba(242,237,225,0.22);color:#c9c2b0;padding:12px 22px;border-radius:10px;cursor:pointer;\">1 · Direction<\u002Fbutton>\n        <button id=\"deckFvS2\" style=\"font-family:'Space Grotesk',sans-serif;font-size:27px;background:transparent;border:2px dashed rgba(242,237,225,0.22);color:#c9c2b0;padding:12px 22px;border-radius:10px;cursor:pointer;\">2 · Sens<\u002Fbutton>\n        <button id=\"deckFvS3\" style=\"font-family:'Space Grotesk',sans-serif;font-size:27px;background:transparent;border:2px dashed rgba(242,237,225,0.22);color:#c9c2b0;padding:12px 22px;border-radius:10px;cursor:pointer;\">3 · Norme<\u002Fbutton>\n        <button id=\"deckFvFlip\" style=\"font-family:'Space Grotesk',sans-serif;font-size:27px;background:transparent;border:2px dashed rgba(242,237,225,0.22);color:#c9c2b0;padding:12px 22px;border-radius:10px;cursor:pointer;\">⇄ Inverser le sens<\u002Fbutton>\n      <\u002Fdiv>\n      <svg id=\"deckFvSvg\" sc-camel-view-box=\"0 0 240 146\" style=\"width:100%;height:auto;display:block;\"><\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;gap:16px;\">\n      <label for=\"deckFvF\" style=\"font-size:28px;color:#c9c2b0;\">Valeur de la force (N)<\u002Flabel>\n      <input type=\"range\" id=\"deckFvF\" min=\"100\" max=\"800\" step=\"50\" style=\"width:100%;height:30px;\">\n      <div id=\"deckFvReadout\" style=\"font-size:30px;color:#f2ede1;line-height:1.5;margin-top:10px;display:flex;flex-direction:column;gap:12px;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Modéliser le parachutiste\" data-screen-label=\"08\" data-speaker-notes=\"Le parachutiste est réduit au point M : les deux forces partent de M. La force résultante est la somme des deux vecteurs.\" style=\"background:#16261f;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:44px 70px 34px;display:flex;flex-direction:column;\">\n  <div style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;margin-bottom:10px;\">1a. Action mécanique<\u002Fdiv>\n  <div style=\"flex:1;display:flex;align-items:center;gap:70px;\">\n    <div style=\"width:520px;flex:none;border:1px solid rgba(242,237,225,0.16);background:rgba(0,0,0,0.22);border-radius:16px;padding:24px;\">\n      <svg id=\"deckParaSvg\" sc-camel-view-box=\"10 14 140 104\" style=\"width:100%;height:auto;display:block;\"><\u002Fsvg>\n      <div style=\"font-size:26px;color:#c9c2b0;text-align:center;margin-top:10px;\">Le parachutiste est modélisé par le point M.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;gap:24px;\">\n      <div style=\"border-left:4px solid rgba(242,237,225,0.3);padding:4px 0 4px 24px;font-size:29px;line-height:1.5;color:#c9c2b0;text-wrap:pretty;\"><strong style=\"font-family:Kalam,cursive;color:#f2ede1;font-weight:700;\">Exemples<\u002Fstrong> La Terre agit sur le parachutiste : cette action est modélisée par son poids <span style=\"white-space:nowrap;\"><span class=\"vec\"><em>P<\u002Fem><\u002Fspan><\u002Fspan>. L'air agit aussi sur lui ; cette action est modélisée par la force <span style=\"white-space:nowrap;\"><span class=\"vec\"><em>F<\u002Fem><\u002Fspan><sub>air/parachutiste<\u002Fsub><\u002Fspan>.<\u002Fdiv>\n      <div data-reveal=\"1\" style=\"border:2px solid rgba(107,191,171,0.4);background:rgba(107,191,171,0.08);border-radius:16px;padding:26px 38px;max-width:1660px;\">\n    <span style=\"display:block;font-family:Kalam,cursive;font-size:26px;color:#6bbfab;letter-spacing:0.06em;margin-bottom:10px;\">📌 À RETENIR<\u002Fspan>\n    <span style=\"font-size:32px;line-height:1.5;text-wrap:pretty;\">Le <strong>point d'application<\u002Fstrong> d'une force est l'endroit où l'on considère qu'elle agit. Lorsque le système est réduit à un point, c'est ce point qui sert de point d'application à toutes les forces.<\u002Fspan>\n  <\u002Fdiv>\n      <p data-reveal=\"2\" style=\"font-size:31px;line-height:1.5;margin:0;text-wrap:pretty;\">En additionnant toutes les forces qui agissent sur le système, on obtient la <strong style=\"color:#e8c468;\">force résultante<\u002Fstrong>.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Flash · caractéristiques\" data-screen-label=\"09\" data-speaker-notes=\"Question flash. Exiger les trois mots et l'unité de la valeur.\" style=\"background:#1d3229;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:70px 92px;display:flex;flex-direction:column;justify-content:center;gap:38px;\">\n  <div style=\"display:inline-flex;align-self:flex-start;font-family:Kalam,cursive;font-size:28px;color:#16261f;background:#e8c468;border-radius:999px;padding:8px 26px;letter-spacing:0.04em;\">Question flash<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:62px;font-weight:700;margin:0;line-height:1.15;max-width:1580px;text-wrap:pretty;\">Une force est représentée par un vecteur. Quelles sont ses trois caractéristiques ? En quelle unité s'exprime sa valeur ?<\u002Fh2>\n  <div data-reveal=\"1\" style=\"display:flex;gap:26px;flex-wrap:wrap;\">\n    <div style=\"border:2px solid #6bbfab;background:rgba(107,191,171,0.16);border-radius:14px;padding:26px 44px;font-size:40px;\">direction ✅<\u002Fdiv><div style=\"border:2px solid #6bbfab;background:rgba(107,191,171,0.16);border-radius:14px;padding:26px 44px;font-size:40px;\">sens ✅<\u002Fdiv><div style=\"border:2px solid #6bbfab;background:rgba(107,191,171,0.16);border-radius:14px;padding:26px 44px;font-size:40px;\">norme ✅<\u002Fdiv>\n  <\u002Fdiv>\n  <p data-reveal=\"2\" style=\"font-size:34px;line-height:1.5;margin:0;max-width:1560px;color:#c9c2b0;text-wrap:pretty;\">La longueur du vecteur est proportionnelle à la valeur de la force, qui s'exprime en <strong style=\"color:#e8c468;\">newton (N)<\u002Fstrong>.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Observer · contact ou distance\" data-screen-label=\"10\" data-speaker-notes=\"Les vélos sont reliés par une barre d'attache. Les aimants sont placés pôle rouge contre pôle rouge : ils se repoussent sans se toucher.\" style=\"background:#16261f;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:44px 70px 34px;display:flex;flex-direction:column;\">\n  <div style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;margin-bottom:10px;\">1b. Action de contact et action à distance<\u002Fdiv>\n  <div style=\"font-family:Kalam,cursive;font-size:44px;color:#e8c468;border-left:5px solid #e8c468;padding:4px 0 4px 26px;line-height:1.3;text-wrap:pretty;\">❓ Dans quel cas les deux objets doivent-ils se toucher pour agir l'un sur l'autre ?<\u002Fdiv>\n  <div style=\"flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px;align-items:stretch;margin-top:24px;\">\n    <div style=\"display:flex;flex-direction:column;gap:16px;\">\n      <div style=\"font-family:Kalam,cursive;font-size:32px;color:#f2ede1;\">Le vélo de l'adulte tire celui de l'enfant<\u002Fdiv>\n      <div style=\"flex:1;border:1px solid rgba(242,237,225,0.16);background:rgba(0,0,0,0.22);border-radius:16px;display:flex;align-items:center;justify-content:center;padding:18px;\"><svg id=\"deckBikeSvg\" sc-camel-view-box=\"0 10 240 132\" style=\"width:100%;height:auto;display:block;\"><\u002Fsvg><\u002Fdiv>\n      <div data-reveal=\"1\" style=\"border:2px solid #6bbfab;background:rgba(107,191,171,0.16);border-radius:14px;padding:22px 30px;font-size:31px;line-height:1.45;text-wrap:pretty;\">Les vélos sont <strong style=\"color:#e8c468;\">en contact<\u002Fstrong> : action de contact.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:16px;\">\n      <div style=\"font-family:Kalam,cursive;font-size:32px;color:#f2ede1;\">L'aimant 2 repousse l'aimant 1<\u002Fdiv>\n      <div style=\"flex:1;border:1px solid rgba(242,237,225,0.16);background:rgba(0,0,0,0.22);border-radius:16px;display:flex;align-items:center;justify-content:center;gap:90px;\">\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:14px;\"><div style=\"display:flex;width:260px;height:64px;border:2px solid #f2ede1;border-radius:4px;overflow:hidden;\"><div style=\"flex:1;background:#0d1512;\"><\u002Fdiv><div style=\"flex:1;background:#d97a63;\"><\u002Fdiv><\u002Fdiv><span style=\"font-size:26px;color:#c9c2b0;\">Aimant 1<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:14px;\"><div style=\"display:flex;width:260px;height:64px;border:2px solid #f2ede1;border-radius:4px;overflow:hidden;\"><div style=\"flex:1;background:#d97a63;\"><\u002Fdiv><div style=\"flex:1;background:#0d1512;\"><\u002Fdiv><\u002Fdiv><span style=\"font-size:26px;color:#c9c2b0;\">Aimant 2<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"2\" style=\"border:2px solid #6bbfab;background:rgba(107,191,171,0.16);border-radius:14px;padding:22px 30px;font-size:31px;line-height:1.45;text-wrap:pretty;\">Les aimants <strong style=\"color:#e8c468;\">ne se touchent pas<\u002Fstrong> : action à distance.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Déf · contact et distance\" data-screen-label=\"11\" data-speaker-notes=\"À copier. Demander d'autres exemples d'actions à distance : poids, attraction d'un aimant, électricité statique.\" style=\"background:#16261f;background-image:linear-gradient(rgba(242,237,225,0.09) 1px,transparent 1px),linear-gradient(90deg,rgba(242,237,225,0.09) 1px,transparent 1px);background-size:96px 96px,96px 96px;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:70px 92px;display:flex;flex-direction:column;justify-content:center;gap:30px;\">\n  <div style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;\">1b. Action de contact et action à distance<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:60px;font-weight:700;margin:0;line-height:1.1;\">Contact ou distance<\u002Fh2>\n  <div style=\"display:inline-flex;align-self:flex-start;font-family:Kalam,cursive;font-size:28px;color:#16261f;background:#6bbfab;border-radius:999px;padding:8px 26px;letter-spacing:0.04em;\">✍️ À copier dans le cahier<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:34px;max-width:1740px;\">\n    <div style=\"display:flex;flex-direction:column;gap:22px;\">\n      <div style=\"border:2px solid rgba(232,196,104,0.45);background:rgba(232,196,104,0.07);border-radius:16px;padding:28px 38px;max-width:1660px;\">\n    <span style=\"display:block;font-family:Kalam,cursive;font-size:26px;color:#e8c468;letter-spacing:0.06em;margin-bottom:12px;\">📘 DÉFINITION<\u002Fspan>\n    <span style=\"display:block;font-size:33px;line-height:1.45;text-wrap:pretty;\">Une <strong>action de contact<\u002Fstrong> n'existe que si le système et l'objet extérieur se touchent.<\u002Fspan>\n  <\u002Fdiv>\n      <div data-reveal=\"1\"><div style=\"border-left:4px solid rgba(242,237,225,0.3);padding:4px 0 4px 24px;font-size:29px;line-height:1.5;color:#c9c2b0;text-wrap:pretty;\"><strong style=\"font-family:Kalam,cursive;color:#f2ede1;font-weight:700;\">Exemple :<\u002Fstrong> le vélo de l'adulte tire le vélo de l'enfant par la barre qui les relie : c'est une action de contact.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:22px;\">\n      <div style=\"border:2px solid rgba(232,196,104,0.45);background:rgba(232,196,104,0.07);border-radius:16px;padding:28px 38px;max-width:1660px;\">\n    <span style=\"display:block;font-family:Kalam,cursive;font-size:26px;color:#e8c468;letter-spacing:0.06em;margin-bottom:12px;\">📘 DÉFINITION<\u002Fspan>\n    <span style=\"display:block;font-size:33px;line-height:1.45;text-wrap:pretty;\">Une <strong>action à distance<\u002Fstrong> s'exerce sans que le système et l'objet extérieur se touchent.<\u002Fspan>\n  <\u002Fdiv>\n      <div data-reveal=\"2\"><div style=\"border-left:4px solid rgba(242,237,225,0.3);padding:4px 0 4px 24px;font-size:29px;line-height:1.5;color:#c9c2b0;text-wrap:pretty;\"><strong style=\"font-family:Kalam,cursive;color:#f2ede1;font-weight:700;\">Exemple :<\u002Fstrong> l'aimant 2 repousse l'aimant 1 sans le toucher : c'est une action à distance.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Diagramme objets-interactions\" data-screen-label=\"12\" data-speaker-notes=\"Construire le diagramme au tableau avec la classe : le système au centre, un trait par interaction. Pointillés pour la distance, trait plein pour le contact. Chaque trait donnera une force.\" style=\"background:#16261f;background-image:linear-gradient(rgba(242,237,225,0.09) 1px,transparent 1px),linear-gradient(90deg,rgba(242,237,225,0.09) 1px,transparent 1px);background-size:96px 96px,96px 96px;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:64px 92px;display:flex;flex-direction:column;justify-content:center;gap:30px;\">\n  <div style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;\">1b. Action de contact et action à distance<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:60px;font-weight:700;margin:0;line-height:1.1;\">Le diagramme objets-interactions<\u002Fh2>\n  <div style=\"border:2px solid rgba(107,191,171,0.4);background:rgba(107,191,171,0.08);border-radius:16px;padding:26px 38px;max-width:1660px;\">\n    <span style=\"display:block;font-family:Kalam,cursive;font-size:26px;color:#6bbfab;letter-spacing:0.06em;margin-bottom:10px;\">📌 À RETENIR<\u002Fspan>\n    <span style=\"font-size:32px;line-height:1.5;text-wrap:pretty;\">Le <strong>diagramme objets-interactions<\u002Fstrong> recense toutes les interactions du système avec l'extérieur : un <strong>trait plein<\u002Fstrong> pour une interaction de contact, des <strong>pointillés<\u002Fstrong> pour une interaction à distance. À chaque action subie par le système correspond une force.<\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"font-size:30px;line-height:1.5;margin:0;color:#c9c2b0;\">Exemple : les interactions du parachutiste avec la Terre et avec l'air.<\u002Fp>\n  <div style=\"display:flex;align-items:center;justify-content:center;gap:0;padding:10px 0;\">\n    <div data-reveal=\"1\" style=\"display:flex;align-items:center;\">\n      <div style=\"border:3px solid #d97a63;border-radius:999px;padding:22px 52px;font-family:Kalam,cursive;font-size:40px;color:#d97a63;\">Terre<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;width:260px;color:#f2ede1;font-size:30px;\"><span>◀<\u002Fspan><div style=\"flex:1;border-top:4px dashed #f2ede1;\"><\u002Fdiv><span>▶<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:3px solid #f2ede1;border-radius:6px;padding:20px 44px;font-size:34px;text-align:center;line-height:1.3;\">Système<br>{parachutiste}<\u002Fdiv>\n    <div data-reveal=\"2\" style=\"display:flex;align-items:center;\">\n      <div style=\"display:flex;align-items:center;width:260px;color:#f2ede1;font-size:30px;\"><span>◀<\u002Fspan><div style=\"flex:1;border-top:4px solid #f2ede1;\"><\u002Fdiv><span>▶<\u002Fspan><\u002Fdiv>\n      <div style=\"border:3px solid #6bbfab;border-radius:999px;padding:22px 64px;font-family:Kalam,cursive;font-size:40px;color:#6bbfab;\">Air<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:center;gap:60px;font-size:26px;color:#c9c2b0;\">\n    <span data-reveal=\"1\">pointillés : action à distance<\u002Fspan>\n    <span data-reveal=\"2\">trait plein : action de contact<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Flash · livre posé\" data-screen-label=\"13\" data-speaker-notes=\"Question flash. On néglige l'action de l'air. Faire dessiner le diagramme objets-interactions dans le cahier.\" style=\"background:#1d3229;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:70px 92px;display:flex;flex-direction:column;justify-content:center;gap:38px;\">\n  <div style=\"display:inline-flex;align-self:flex-start;font-family:Kalam,cursive;font-size:28px;color:#16261f;background:#e8c468;border-radius:999px;padding:8px 26px;letter-spacing:0.04em;\">Question flash<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:62px;font-weight:700;margin:0;line-height:1.15;max-width:1580px;text-wrap:pretty;\">Un livre est posé sur une table. Avec quels objets interagit-il ? Préciser à chaque fois s'il s'agit d'une action de contact ou à distance.<\u002Fh2>\n  <div data-reveal=\"1\" style=\"display:flex;gap:26px;flex-wrap:wrap;\">\n    <div style=\"border:2px solid #6bbfab;background:rgba(107,191,171,0.16);border-radius:14px;padding:26px 44px;font-size:40px;\">la Terre : à distance ✅<\u002Fdiv><div style=\"border:2px solid #6bbfab;background:rgba(107,191,171,0.16);border-radius:14px;padding:26px 44px;font-size:40px;\">la table : contact ✅<\u002Fdiv>\n  <\u002Fdiv>\n  <p data-reveal=\"2\" style=\"font-size:34px;line-height:1.5;margin:0;max-width:1560px;color:#c9c2b0;text-wrap:pretty;\">Dans le diagramme objets-interactions : <strong style=\"color:#e8c468;\">pointillés<\u002Fstrong> entre le livre et la Terre, <strong style=\"color:#e8c468;\">trait plein<\u002Fstrong> entre le livre et la table.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"§ Actions réciproques\" data-screen-label=\"14\" data-speaker-notes=\"Partie 2. Une action ne va jamais seule : si A agit sur B, B agit sur A.\" style=\"background:#1d3229;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:70px 92px;display:flex;flex-direction:column;justify-content:center;gap:22px;\">\n  <div style=\"font-family:Kalam,cursive;font-size:190px;color:rgba(232,196,104,0.22);line-height:0.9;\">2<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:82px;font-weight:700;margin:0;line-height:1.1;\">Le principe des actions réciproques<\u002Fh2>\n  <p style=\"font-size:36px;color:#c9c2b0;margin:0;max-width:1300px;\">Si A agit sur B, B agit-il sur A ?<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Observer · livre sur table\" data-screen-label=\"15\" data-speaker-notes=\"Laisser débattre sur la deuxième question : beaucoup d'élèves pensent que le livre « pousse plus fort ». Ne pas encore donner le nom du principe avant le dernier dévoilement.\" style=\"background:#16261f;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:44px 70px 34px;display:flex;flex-direction:column;\">\n  <div style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;margin-bottom:10px;\">2. Le principe des actions réciproques<\u002Fdiv>\n  <div style=\"flex:1;display:flex;align-items:center;gap:70px;\">\n    <div style=\"width:740px;flex:none;\">\n      <svg id=\"deckRaObsSvg\" sc-camel-view-box=\"0 20 240 130\" style=\"width:100%;height:auto;display:block;\"><\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;gap:26px;\">\n      <div style=\"font-family:Kalam,cursive;font-size:44px;color:#e8c468;border-left:5px solid #e8c468;padding:4px 0 4px 26px;line-height:1.3;text-wrap:pretty;\">❓ Le livre appuie sur la table. La table agit-elle, elle aussi, sur le livre ?<\u002Fdiv>\n      <div data-reveal=\"1\" style=\"border:2px solid #6bbfab;background:rgba(107,191,171,0.16);border-radius:14px;padding:22px 30px;font-size:31px;line-height:1.45;text-wrap:pretty;\"><strong style=\"color:#e8c468;\">Oui<\u002Fstrong> : elle le retient. Sans la table, le livre tomberait.<\u002Fdiv>\n      <div data-reveal=\"2\" style=\"font-family:Kalam,cursive;font-size:42px;color:#e8c468;border-left:5px solid #e8c468;padding:4px 0 4px 26px;line-height:1.3;text-wrap:pretty;\">❓ Laquelle des deux actions est la plus forte ?<\u002Fdiv>\n      <div data-reveal=\"3\" style=\"border:2px solid #6bbfab;background:rgba(107,191,171,0.16);border-radius:14px;padding:22px 30px;font-size:31px;line-height:1.45;text-wrap:pretty;\"><strong style=\"color:#e8c468;\">Aucune<\u002Fstrong> : les deux forces ont la même valeur.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Déf · actions réciproques\" data-screen-label=\"16\" data-speaker-notes=\"À copier. Insister : les deux forces s'exercent sur deux systèmes différents (l'une sur A, l'autre sur B).\" style=\"background:#16261f;background-image:linear-gradient(rgba(242,237,225,0.09) 1px,transparent 1px),linear-gradient(90deg,rgba(242,237,225,0.09) 1px,transparent 1px);background-size:96px 96px,96px 96px;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:70px 92px;display:flex;flex-direction:column;justify-content:center;gap:30px;\">\n  <div style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;\">2. Le principe des actions réciproques<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:60px;font-weight:700;margin:0;line-height:1.1;\">Deux systèmes en interaction<\u002Fh2>\n  <div style=\"display:inline-flex;align-self:flex-start;font-family:Kalam,cursive;font-size:28px;color:#16261f;background:#6bbfab;border-radius:999px;padding:8px 26px;letter-spacing:0.04em;\">✍️ À copier dans le cahier<\u002Fdiv>\n  <div style=\"display:flex;gap:34px;align-items:stretch;max-width:1720px;\">\n    <div style=\"flex:1;border:2px solid rgba(232,196,104,0.45);background:rgba(232,196,104,0.07);border-radius:16px;padding:28px 38px;\">\n      <span style=\"display:block;font-family:Kalam,cursive;font-size:26px;color:#e8c468;letter-spacing:0.06em;margin-bottom:12px;\">📘 DÉFINITION<\u002Fspan>\n      <span style=\"display:block;font-size:34px;line-height:1.45;text-wrap:pretty;\">Si un système A agit sur un système B, alors B agit aussi sur A : ils sont en <strong>interaction<\u002Fstrong>. Les deux forces sont opposées : elles ont la <strong>même droite d'action<\u002Fstrong>, la <strong>même valeur<\u002Fstrong> et des <strong>sens contraires<\u002Fstrong>.<\u002Fspan>\n    <\u002Fdiv>\n    <div data-reveal=\"1\" style=\"flex:none;width:480px;background:rgba(0,0,0,0.25);border:1px solid rgba(242,237,225,0.16);border-radius:14px;padding:26px;color:#e8c468;font-size:56px;display:flex;align-items:center;justify-content:center;gap:14px;\"><span><span class=\"vec\"><em>F<\u002Fem><\u002Fspan><sub style=\"font-size:30px;\">A/B<\u002Fsub><\u002Fspan> = −<span><span class=\"vec\"><em>F<\u002Fem><\u002Fspan><sub style=\"font-size:30px;\">B/A<\u002Fsub><\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p data-reveal=\"2\" style=\"font-size:32px;line-height:1.5;margin:0;max-width:1620px;text-wrap:pretty;\">Ce principe s'applique à toutes les interactions, de contact comme à distance, que les systèmes bougent ou non.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Anim · actions réciproques\" data-screen-label=\"17\" data-speaker-notes=\"Contact : augmenter la masse du livre, les deux flèches grandissent ensemble. À distance : la Terre est 80 fois plus massive que la Lune, et pourtant les deux forces ont la même valeur. C'est le point qui surprend le plus.\" style=\"background:#16261f;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:44px 70px 34px;display:flex;flex-direction:column;\">\n  <div style=\"display:flex;align-items:baseline;gap:24px;flex-wrap:wrap;margin-bottom:18px;\">\n    <h2 style=\"font-family:Kalam,cursive;font-size:50px;font-weight:700;margin:0;\">🤝 Actions réciproques<\u002Fh2>\n    <span style=\"font-size:26px;color:#c9c2b0;\">Basculez entre une interaction de contact et une interaction à distance.<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"flex:1;display:flex;align-items:center;gap:60px;\">\n    <div style=\"width:860px;flex:none;display:flex;flex-direction:column;gap:20px;\">\n      <div style=\"display:flex;gap:16px;flex-wrap:wrap;\">\n        <button id=\"deckRaContact\" style=\"font-family:'Space Grotesk',sans-serif;font-size:27px;background:transparent;border:2px dashed rgba(242,237,225,0.22);color:#c9c2b0;padding:12px 24px;border-radius:10px;cursor:pointer;\">Contact (livre / table)<\u002Fbutton>\n        <button id=\"deckRaDistance\" style=\"font-family:'Space Grotesk',sans-serif;font-size:27px;background:transparent;border:2px dashed rgba(242,237,225,0.22);color:#c9c2b0;padding:12px 24px;border-radius:10px;cursor:pointer;\">À distance (Terre / Lune)<\u002Fbutton>\n      <\u002Fdiv>\n      <svg id=\"deckRaSvg\" sc-camel-view-box=\"0 20 240 132\" style=\"width:100%;height:auto;display:block;\"><\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;gap:18px;\">\n      <div id=\"deckRaMWrap\" style=\"display:flex;flex-direction:column;gap:12px;\">\n        <label for=\"deckRaM\" style=\"font-size:28px;color:#c9c2b0;\">Masse du livre (g)<\u002Flabel>\n        <input type=\"range\" id=\"deckRaM\" min=\"100\" max=\"2000\" step=\"100\" style=\"width:100%;height:30px;\">\n      <\u002Fdiv>\n      <div id=\"deckRaReadout\" style=\"font-size:31px;color:#c9c2b0;line-height:1.6;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Flash · Terre-Lune\" data-screen-label=\"18\" data-speaker-notes=\"Question flash à choix. Vote à main levée avant de dévoiler. La réponse B est la plus fréquente : la corriger avec l'animation précédente.\" style=\"background:#1d3229;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:70px 92px;display:flex;flex-direction:column;justify-content:center;gap:36px;\">\n  <div style=\"display:inline-flex;align-self:flex-start;font-family:Kalam,cursive;font-size:28px;color:#16261f;background:#e8c468;border-radius:999px;padding:8px 26px;letter-spacing:0.04em;\">Question flash<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:62px;font-weight:700;margin:0;line-height:1.15;max-width:1580px;text-wrap:pretty;\">Deux systèmes sont en interaction. Que peut-on dire des deux forces qu'ils exercent l'un sur l'autre ?<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:18px;align-items:flex-start;\">\n    <div style=\"border:2px dashed rgba(242,237,225,0.35);border-radius:14px;padding:20px 32px;font-size:33px;\">A · même droite d'action, sens opposés, même valeur<\u002Fdiv>\n    <div style=\"border:2px dashed rgba(242,237,225,0.35);border-radius:14px;padding:20px 32px;font-size:33px;\">B · directions différentes, mêmes sens, valeurs différentes<\u002Fdiv>\n    <div style=\"border:2px dashed rgba(242,237,225,0.35);border-radius:14px;padding:20px 32px;font-size:33px;\">C · cela dépend s'ils sont en mouvement ou non<\u002Fdiv>\n  <\u002Fdiv>\n  <div data-reveal=\"1\" style=\"display:flex;gap:26px;flex-wrap:wrap;\">\n    <div style=\"border:2px solid #6bbfab;background:rgba(107,191,171,0.16);border-radius:14px;padding:24px 44px;font-size:40px;\">A ✅<\u002Fdiv>\n  <\u002Fdiv>\n  <p data-reveal=\"2\" style=\"font-size:33px;line-height:1.5;margin:0;max-width:1560px;color:#c9c2b0;text-wrap:pretty;\">C'est le principe des actions réciproques, valable pour toute interaction : de contact ou à distance, en mouvement ou au repos.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"§ Trois actions à modéliser\" data-screen-label=\"19\" data-speaker-notes=\"Partie 3. Trois actions qu'on rencontre dans presque tous les exercices.\" style=\"background:#1d3229;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:70px 92px;display:flex;flex-direction:column;justify-content:center;gap:22px;\">\n  <div style=\"font-family:Kalam,cursive;font-size:190px;color:rgba(232,196,104,0.22);line-height:0.9;\">3<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:82px;font-weight:700;margin:0;line-height:1.1;\">Trois actions à modéliser<\u002Fh2>\n  <p style=\"font-size:36px;color:#c9c2b0;margin:0;max-width:1300px;\">La gravitation, le poids, l'action d'un fil ou d'un support.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Déf · gravitation\" data-screen-label=\"20\" data-speaker-notes=\"À copier. Faire repérer sur un schéma au tableau : F A/B s'applique en B et pointe vers A (attractive).\" style=\"background:#16261f;background-image:linear-gradient(rgba(242,237,225,0.09) 1px,transparent 1px),linear-gradient(90deg,rgba(242,237,225,0.09) 1px,transparent 1px);background-size:96px 96px,96px 96px;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:70px 92px;display:flex;flex-direction:column;justify-content:center;gap:30px;\">\n  <div style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;\">3a. Forces d'interaction gravitationnelle<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:60px;font-weight:700;margin:0;line-height:1.1;\">L'interaction gravitationnelle<\u002Fh2>\n  <div style=\"display:inline-flex;align-self:flex-start;font-family:Kalam,cursive;font-size:28px;color:#16261f;background:#6bbfab;border-radius:999px;padding:8px 26px;letter-spacing:0.04em;\">✍️ À copier dans le cahier<\u002Fdiv>\n  <div style=\"border:2px solid rgba(232,196,104,0.45);background:rgba(232,196,104,0.07);border-radius:16px;padding:28px 38px;max-width:1660px;\">\n    <span style=\"display:block;font-family:Kalam,cursive;font-size:26px;color:#e8c468;letter-spacing:0.06em;margin-bottom:12px;\">📘 DÉFINITION<\u002Fspan>\n    <span style=\"display:block;font-size:33px;line-height:1.45;text-wrap:pretty;\">Deux objets qui ont une masse s'attirent toujours l'un l'autre : c'est l'interaction <strong>gravitationnelle<\u002Fstrong>, décrite par Newton. Pour deux objets de centres A et B, de masses <em>m<\u002Fem><sub>A<\u002Fsub> et <em>m<\u002Fem><sub>B<\u002Fsub>, séparés d'une distance <em>d<\u002Fem>, on la modélise par deux forces attractives <span class=\"vec\"><em>F<\u002Fem><\u002Fspan><sub>A/B<\u002Fsub> et <span class=\"vec\"><em>F<\u002Fem><\u002Fspan><sub>B/A<\u002Fsub>.<\u002Fspan>\n  <\u002Fdiv>\n  <p data-reveal=\"1\" style=\"font-size:32px;line-height:1.5;margin:0;max-width:1660px;text-wrap:pretty;\">Ces deux forces sont opposées (<span class=\"vec\"><em>F<\u002Fem><\u002Fspan><sub>A/B<\u002Fsub> = −<span class=\"vec\"><em>F<\u002Fem><\u002Fspan><sub>B/A<\u002Fsub>). Elles ne s'appliquent pas au même point : <span class=\"vec\"><em>F<\u002Fem><\u002Fspan><sub>A/B<\u002Fsub> s'applique en <strong style=\"color:#e8c468;\">B<\u002Fstrong>, <span class=\"vec\"><em>F<\u002Fem><\u002Fspan><sub>B/A<\u002Fsub> s'applique en <strong style=\"color:#e8c468;\">A<\u002Fstrong>.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Formule · gravitation\" data-screen-label=\"21\" data-speaker-notes=\"Faire lire la formule à voix haute. Les masses au numérateur : plus les objets sont massifs, plus ils s'attirent. La distance au carré au dénominateur : s'éloigner réduit très vite la force. Les unités SI sont obligatoires.\" style=\"background:#16261f;background-image:linear-gradient(rgba(242,237,225,0.09) 1px,transparent 1px),linear-gradient(90deg,rgba(242,237,225,0.09) 1px,transparent 1px);background-size:96px 96px,96px 96px;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:70px 92px;display:flex;flex-direction:column;justify-content:center;gap:34px;\">\n  <div style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;\">3a. Forces d'interaction gravitationnelle<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:60px;font-weight:700;margin:0;line-height:1.1;\">Valeur de la force<\u002Fh2>\n  <div style=\"display:flex;gap:44px;align-items:center;\">\n    <div style=\"flex:none;background:rgba(0,0,0,0.25);border:1px solid rgba(242,237,225,0.16);border-radius:14px;padding:36px 56px;color:#e8c468;font-size:64px;display:flex;align-items:center;gap:20px;\">\n      <em>F<\u002Fem> = <em>G<\u002Fem> ×\n      <span style=\"display:inline-flex;flex-direction:column;align-items:center;line-height:1.15;\"><span style=\"border-bottom:3px solid currentColor;padding:0 16px 8px;\"><em>m<\u002Fem><sub style=\"font-size:36px;\">A<\u002Fsub> × <em>m<\u002Fem><sub style=\"font-size:36px;\">B<\u002Fsub><\u002Fspan><span style=\"padding:8px 16px 0;\"><em>d<\u002Fem>²<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n    <div data-reveal=\"1\" style=\"flex:1;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 26px;font-size:31px;line-height:1.35;align-items:baseline;\">\n      <span style=\"color:#e8c468;\"><em>F<\u002Fem><\u002Fspan><span>valeur des deux forces, en newton (N)<\u002Fspan>\n      <span style=\"color:#e8c468;\"><em>m<\u002Fem><sub>A<\u002Fsub>, <em>m<\u002Fem><sub>B<\u002Fsub><\u002Fspan><span>masses des deux objets, en kilogramme (kg)<\u002Fspan>\n      <span style=\"color:#e8c468;\"><em>d<\u002Fem><\u002Fspan><span>distance entre les centres A et B, en mètre (m)<\u002Fspan>\n      <span style=\"color:#e8c468;\"><em>G<\u002Fem><\u002Fspan><span>constante de gravitation universelle<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-reveal=\"2\" style=\"border:2px solid rgba(107,191,171,0.4);background:rgba(107,191,171,0.08);border-radius:16px;padding:24px 36px;max-width:1660px;\">\n    <span style=\"display:block;font-family:Kalam,cursive;font-size:26px;color:#6bbfab;letter-spacing:0.06em;margin-bottom:8px;\">📌 À RETENIR<\u002Fspan>\n    <span style=\"font-size:33px;line-height:1.45;\">Avec trois chiffres significatifs, <strong style=\"color:#e8c468;\"><em>G<\u002Fem> = 6,67 × 10⁻¹¹ N·m²·kg⁻²<\u002Fstrong>.<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Anim · gravitation\" data-screen-label=\"22\" data-speaker-notes=\"Valeurs de départ : on retrouve 4,00 × 10²⁴ N. Faire prédire avant de bouger : doubler une masse double F ; doubler d divise F par 4. Les flèches ne sont pas à l'échelle (la force varie sur plusieurs puissances de 10).\" style=\"background:#16261f;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:44px 70px 34px;display:flex;flex-direction:column;\">\n  <div style=\"display:flex;align-items:baseline;gap:24px;flex-wrap:wrap;margin-bottom:14px;\">\n    <h2 style=\"font-family:Kalam,cursive;font-size:50px;font-weight:700;margin:0;\">🪐 Calculateur de force gravitationnelle<\u002Fh2>\n    <span style=\"font-size:26px;color:#c9c2b0;\">Réglez les masses et la distance.<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"flex:1;display:flex;align-items:center;gap:56px;\">\n    <div style=\"width:820px;flex:none;\">\n      <svg id=\"deckGfSvg\" sc-camel-view-box=\"0 8 250 120\" style=\"width:100%;height:auto;display:block;\"><\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;gap:12px;\">\n      <label for=\"deckGfMA\" style=\"font-size:27px;color:#c9c2b0;\">Masse de A (× 10²⁴ kg)<\u002Flabel>\n      <input type=\"range\" id=\"deckGfMA\" min=\"1\" max=\"10\" step=\"1\" style=\"width:100%;height:30px;\">\n      <label for=\"deckGfMB\" style=\"font-size:27px;color:#c9c2b0;\">Masse de B (× 10²⁴ kg)<\u002Flabel>\n      <input type=\"range\" id=\"deckGfMB\" min=\"1\" max=\"10\" step=\"1\" style=\"width:100%;height:30px;\">\n      <label for=\"deckGfD\" style=\"font-size:27px;color:#c9c2b0;\">Distance <em>d<\u002Fem> (× 10⁶ m)<\u002Flabel>\n      <input type=\"range\" id=\"deckGfD\" min=\"1\" max=\"50\" step=\"1\" style=\"width:100%;height:30px;\">\n      <div id=\"deckGfReadout\" style=\"font-size:30px;color:#c9c2b0;line-height:1.7;margin-top:8px;display:flex;flex-direction:column;gap:4px;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Flash · distance doublée\" data-screen-label=\"23\" data-speaker-notes=\"Question flash. Vérifier ensuite avec l'animation : d de 10 à 20, F passe de 4,00 à 1,00 × 10²⁴ N.\" style=\"background:#1d3229;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:70px 92px;display:flex;flex-direction:column;justify-content:center;gap:38px;\">\n  <div style=\"display:inline-flex;align-self:flex-start;font-family:Kalam,cursive;font-size:28px;color:#16261f;background:#e8c468;border-radius:999px;padding:8px 26px;letter-spacing:0.04em;\">Question flash<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:62px;font-weight:700;margin:0;line-height:1.15;max-width:1580px;text-wrap:pretty;\">On double la distance <em>d<\u002Fem> entre A et B, sans changer les masses. Que devient la valeur <em>F<\u002Fem> de la force ?<\u002Fh2>\n  <div data-reveal=\"1\" style=\"display:flex;gap:26px;flex-wrap:wrap;\">\n    <div style=\"border:2px solid #6bbfab;background:rgba(107,191,171,0.16);border-radius:14px;padding:26px 44px;font-size:40px;\">elle est divisée par 4 ✅<\u002Fdiv>\n  <\u002Fdiv>\n  <p data-reveal=\"2\" style=\"font-size:34px;line-height:1.5;margin:0;max-width:1560px;color:#c9c2b0;text-wrap:pretty;\"><em>d<\u002Fem> est au carré au dénominateur : (2<em>d<\u002Fem>)² = 4<em>d<\u002Fem>². La force n'est pas divisée par 2 mais par <strong style=\"color:#e8c468;\">4<\u002Fstrong>.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Déf · poids\" data-screen-label=\"24\" data-speaker-notes=\"À copier. Le poids n'est qu'un cas particulier de la gravitation : A est l'astre, B l'objet, et d devient le rayon R de l'astre (l'objet est à sa surface).\" style=\"background:#16261f;background-image:linear-gradient(rgba(242,237,225,0.09) 1px,transparent 1px),linear-gradient(90deg,rgba(242,237,225,0.09) 1px,transparent 1px);background-size:96px 96px,96px 96px;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:70px 92px;display:flex;flex-direction:column;justify-content:center;gap:30px;\">\n  <div style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;\">3b. Poids d'un objet<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:60px;font-weight:700;margin:0;line-height:1.1;\">Le poids, une force gravitationnelle<\u002Fh2>\n  <div style=\"display:inline-flex;align-self:flex-start;font-family:Kalam,cursive;font-size:28px;color:#16261f;background:#6bbfab;border-radius:999px;padding:8px 26px;letter-spacing:0.04em;\">✍️ À copier dans le cahier<\u002Fdiv>\n  <div style=\"border:2px solid rgba(232,196,104,0.45);background:rgba(232,196,104,0.07);border-radius:16px;padding:28px 38px;max-width:1660px;\">\n    <span style=\"display:block;font-family:Kalam,cursive;font-size:26px;color:#e8c468;letter-spacing:0.06em;margin-bottom:12px;\">📘 DÉFINITION<\u002Fspan>\n    <span style=\"display:block;font-size:34px;line-height:1.45;text-wrap:pretty;\">Le poids <em>P<\u002Fem><sub>A<\u002Fsub> d'un objet situé à la surface d'un astre A correspond, en bonne approximation, à la force gravitationnelle que l'astre exerce sur l'objet.<\u002Fspan>\n  <\u002Fdiv>\n  <div data-reveal=\"1\" style=\"display:flex;gap:40px;align-items:center;\">\n    <div style=\"flex:none;background:rgba(0,0,0,0.25);border:1px solid rgba(242,237,225,0.16);border-radius:14px;padding:28px 44px;color:#e8c468;font-size:52px;display:flex;align-items:center;gap:18px;\">\n      <em>P<\u002Fem><sub style=\"font-size:30px;\">A<\u002Fsub> = <em>G<\u002Fem> ×\n      <span style=\"display:inline-flex;flex-direction:column;align-items:center;line-height:1.15;\"><span style=\"border-bottom:3px solid currentColor;padding:0 14px 8px;\"><em>m<\u002Fem><sub style=\"font-size:28px;\">A<\u002Fsub> × <em>m<\u002Fem><sub style=\"font-size:28px;\">objet<\u002Fsub><\u002Fspan><span style=\"padding:8px 14px 0;\"><em>R<\u002Fem><sub style=\"font-size:28px;\">A<\u002Fsub>²<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"flex:1;font-size:31px;line-height:1.5;margin:0;text-wrap:pretty;\">On note <em>g<\u002Fem><sub>A<\u002Fsub> l'intensité de la pesanteur à la surface de l'astre A ; elle change d'un astre à l'autre : <em>P<\u002Fem><sub>A<\u002Fsub> = <em>m<\u002Fem><sub>objet<\u002Fsub> × <em>g<\u002Fem><sub>A<\u002Fsub>, avec <em>g<\u002Fem><sub>A<\u002Fsub> = <em>G<\u002Fem> × <em>m<\u002Fem><sub>A<\u002Fsub> / <em>R<\u002Fem><sub>A<\u002Fsub>².<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"À retenir · P = mg\" data-screen-label=\"25\" data-speaker-notes=\"La formule à connaître par cœur en 2nde est P = mg. Faire comparer les trois valeurs de g : sur la Lune, on pèse environ six fois moins que sur Terre.\" style=\"background:#16261f;background-image:linear-gradient(rgba(242,237,225,0.09) 1px,transparent 1px),linear-gradient(90deg,rgba(242,237,225,0.09) 1px,transparent 1px);background-size:96px 96px,96px 96px;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:70px 92px;display:flex;flex-direction:column;justify-content:center;gap:30px;\">\n  <div style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;\">3b. Poids d'un objet<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:60px;font-weight:700;margin:0;line-height:1.1;\">Poids et intensité de la pesanteur<\u002Fh2>\n  <div style=\"display:flex;gap:34px;align-items:stretch;max-width:1720px;\">\n    <div style=\"flex:1;border:2px solid rgba(107,191,171,0.4);background:rgba(107,191,171,0.08);border-radius:16px;padding:28px 38px;\">\n      <span style=\"display:block;font-family:Kalam,cursive;font-size:26px;color:#6bbfab;letter-spacing:0.06em;margin-bottom:12px;\">📌 À RETENIR<\u002Fspan>\n      <span style=\"font-size:33px;line-height:1.5;text-wrap:pretty;\">Un système de masse <em>m<\u002Fem> a pour poids <span class=\"vec\"><em>P<\u002Fem><\u002Fspan> = <em>m<\u002Fem><span class=\"vec\"><em>g<\u002Fem><\u002Fspan>. Le vecteur <span class=\"vec\"><em>g<\u002Fem><\u002Fspan> est vertical et orienté vers le bas ; <span class=\"vec\"><em>P<\u002Fem><\u002Fspan> et <span class=\"vec\"><em>g<\u002Fem><\u002Fspan> varient selon l'endroit où se trouve le système.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:none;width:440px;background:rgba(0,0,0,0.25);border:1px solid rgba(242,237,225,0.16);border-radius:14px;padding:26px;color:#e8c468;font-size:64px;display:flex;align-items:center;justify-content:center;\"><em>P<\u002Fem>&nbsp;=&nbsp;<em>m<\u002Fem>&nbsp;×&nbsp;<em>g<\u002Fem><\u002Fdiv>\n  <\u002Fdiv>\n  <div data-reveal=\"1\" style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;max-width:1720px;\">\n    <div style=\"border:1px solid rgba(242,237,225,0.16);background:rgba(0,0,0,0.22);border-radius:14px;padding:20px 28px;display:flex;flex-direction:column;gap:6px;\"><span style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;\">Terre<\u002Fspan><span style=\"font-size:34px;color:#e8c468;\"><em>g<\u002Fem> = 9,8 N·kg⁻¹<\u002Fspan><\u002Fdiv>\n    <div style=\"border:1px solid rgba(242,237,225,0.16);background:rgba(0,0,0,0.22);border-radius:14px;padding:20px 28px;display:flex;flex-direction:column;gap:6px;\"><span style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;\">Mars<\u002Fspan><span style=\"font-size:34px;color:#e8c468;\"><em>g<\u002Fem> = 3,7 N·kg⁻¹<\u002Fspan><\u002Fdiv>\n    <div style=\"border:1px solid rgba(242,237,225,0.16);background:rgba(0,0,0,0.22);border-radius:14px;padding:20px 28px;display:flex;flex-direction:column;gap:6px;\"><span style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;\">Lune<\u002Fspan><span style=\"font-size:34px;color:#e8c468;\"><em>g<\u002Fem> = 1,6 N·kg⁻¹<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p data-reveal=\"2\" style=\"font-size:31px;line-height:1.5;margin:0;max-width:1660px;color:#c9c2b0;text-wrap:pretty;\">Un astronaute garde la même masse sur la Terre et sur la Lune, mais son poids n'a pas la même valeur.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Anim · poids selon l'astre\" data-screen-label=\"26\" data-speaker-notes=\"Même objet posé sur les trois astres, même échelle pour les flèches. Faire varier la masse : les trois poids changent, leur rapport reste le même. Sélectionner un astre pour afficher le calcul.\" style=\"background:#16261f;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:44px 70px 34px;display:flex;flex-direction:column;\">\n  <div style=\"display:flex;align-items:baseline;gap:24px;flex-wrap:wrap;margin-bottom:14px;\">\n    <h2 style=\"font-family:Kalam,cursive;font-size:50px;font-weight:700;margin:0;\">⚖️ Poids selon l'astre<\u002Fh2>\n    <span style=\"font-size:26px;color:#c9c2b0;\">Choisissez un astre et une masse.<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"flex:1;display:flex;align-items:center;gap:56px;\">\n    <div style=\"width:860px;flex:none;display:flex;flex-direction:column;gap:20px;\">\n      <div style=\"display:flex;gap:16px;flex-wrap:wrap;\">\n        <button id=\"deckWcTerre\" style=\"font-family:'Space Grotesk',sans-serif;font-size:27px;background:transparent;border:2px dashed rgba(242,237,225,0.22);color:#c9c2b0;padding:12px 24px;border-radius:10px;cursor:pointer;\">Terre<\u002Fbutton>\n        <button id=\"deckWcMars\" style=\"font-family:'Space Grotesk',sans-serif;font-size:27px;background:transparent;border:2px dashed rgba(242,237,225,0.22);color:#c9c2b0;padding:12px 24px;border-radius:10px;cursor:pointer;\">Mars<\u002Fbutton>\n        <button id=\"deckWcLune\" style=\"font-family:'Space Grotesk',sans-serif;font-size:27px;background:transparent;border:2px dashed rgba(242,237,225,0.22);color:#c9c2b0;padding:12px 24px;border-radius:10px;cursor:pointer;\">Lune<\u002Fbutton>\n      <\u002Fdiv>\n      <svg id=\"deckWcSvg\" sc-camel-view-box=\"0 0 240 160\" style=\"width:100%;height:auto;display:block;\"><\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;gap:14px;\">\n      <label for=\"deckWcM\" style=\"font-size:28px;color:#c9c2b0;\">Masse de l'objet (kg)<\u002Flabel>\n      <input type=\"range\" id=\"deckWcM\" min=\"1\" max=\"100\" step=\"1\" style=\"width:100%;height:30px;\">\n      <div id=\"deckWcReadout\" style=\"font-size:31px;color:#c9c2b0;line-height:1.6;margin-top:8px;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Flash · poids sur la Lune\" data-screen-label=\"27\" data-speaker-notes=\"Question flash. La deuxième question piège ceux qui confondent masse et poids.\" style=\"background:#1d3229;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:70px 92px;d
