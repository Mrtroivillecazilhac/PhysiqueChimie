  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

Grotesk';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"2d4f6335-3da1-4236-9368-738ef0d1994c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"a0e2be7f-46f0-4101-8310-388a24582033\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"9927ab4f-886d-41f7-aa5b-78a8da359584\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"2d4f6335-3da1-4236-9368-738ef0d1994c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root{\n    --board:#16261f; --board-2:#1d3229; --chalk:#f2ede1; --chalk-dim:#c9c2b0;\n    --yellow:#e8c468; --teal:#6bbfab; --coral:#d97a63;\n    --line:rgba(242,237,225,0.14);\n    --font-display:'Kalam','Segoe Print',cursive;\n    --font-body:'Space Grotesk','Segoe UI',sans-serif;\n  }\n  html,body{margin:0;padding:0;background:#0d1512;}\n  *{box-sizing:border-box;}\n  a{color:#e8c468;text-decoration:none;}\n  a:hover{color:#f2ede1;}\n  input[type=range]{accent-color:#e8c468;}\n  /* fractions écrites en ligne dans les readouts des animations */\n  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 6px;line-height:1.1;}\n  .frac .num{border-bottom:2px solid currentColor;padding:0 8px 3px;}\n  .frac .den{padding:3px 8px 0;}\n<\u002Fstyle>\n<script src=\"b2588c15-12c3-42d2-9a9a-840aeb2e4c8b\"><\u002Fscript>\n<script src=\"4d40b91a-29ae-4ab0-82aa-dfaa48f2aa4a\"><\u002Fscript>\n<script src=\"31c2c509-1477-4cfa-9116-dba36cdee049\"><\u002Fscript>\n<script>\n/* Certains environnements de prévisualisation ne servent les fichiers voisins\n   qu'avec le jeton présent dans l'URL du document. Si un script n'a pas pu se\n   charger, on le recharge une seule fois avec ce jeton. */\n(function () {\n  if (window.__ch2Retry) return;\n  window.__ch2Retry = true;\n  var q = location.search || \"\";\n  if (!q) return;\n  var checks = [\n    [\"support.js\", function () { return typeof DCLogic !== \"undefined\"; }],\n    [\"animations-common.js\", function () { return typeof NA !== \"undefined\"; }],\n    [\"animations-ch2.js\", function () { return typeof initBeerLambert === \"function\"; }],\n    [\"deck-stage.js\", function () { return !!customElements.get(\"deck-stage\"); }]\n  ];\n  function step(i) {\n    if (i >= checks.length) return;\n    var name = checks[i][0], ok = checks[i][1];\n    var done = function () { step(i + 1); };\n    var already = false;\n    try { already = ok(); } catch (e) { already = false; }\n    if (already) return done();\n    var s = document.createElement(\"script\");\n    s.src = name + q;\n    s.onload = done;\n    s.onerror = done;\n    document.head.appendChild(s);\n  }\n  setTimeout(function () { step(0); }, 0);\n})();\n<\u002Fscript>\n<\u002Fhelmet>\n\n<x-import component-from-global-scope=\"deck-stage\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\">\n\n<section data-label=\"Titre\" data-screen-label=\"01\" data-speaker-notes=\"Rappeler le chapitre 1 : on savait déjà calculer une concentration à partir de n et V. Ici on va la mesurer sans toucher à la solution, avec de la lumière.\" style=\"background:#16261f;background-image:linear-gradient(rgba(242,237,225,0.09) 1px,transparent 1px),linear-gradient(90deg,rgba(242,237,225,0.09) 1px,transparent 1px);background-size:96px 96px,96px 96px;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:90px 110px;display:flex;flex-direction:column;justify-content:center;gap:34px;\">\n  <div style=\"display:inline-flex;align-self:flex-start;font-family:Kalam,cursive;font-size:30px;color:#16261f;background:#6bbfab;border-radius:999px;padding:8px 28px;letter-spacing:0.04em;\">Chimie · 1ère spé PC<\u002Fdiv>\n  <div style=\"font-family:Kalam,cursive;font-size:40px;color:#e8c468;\">Chapitre 2<\u002Fdiv>\n  <h1 style=\"font-family:Kalam,cursive;font-weight:700;font-size:104px;line-height:1.05;margin:0;max-width:1500px;text-wrap:pretty;\">Spectrophotométrie UV-visible colorées<\u002Fh1>\n  <div style=\"width:220px;height:4px;background:rgba(242,237,225,0.28);\"><\u002Fdiv>\n  <p style=\"font-size:34px;color:#c9c2b0;margin:0;max-width:1200px;\">Mesurer une concentration avec de la lumière : absorbance, loi de Beer-Lambert et dosage par étalonnage.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Objectifs\" data-screen-label=\"02\" data-speaker-notes=\"Annoncer les trois objectifs. Insister : l'objectif 3 est celui du TP.\" style=\"background:#16261f;background-image:linear-gradient(rgba(242,237,225,0.09) 1px,transparent 1px),linear-gradient(90deg,rgba(242,237,225,0.09) 1px,transparent 1px);background-size:96px 96px,96px 96px;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:70px 92px;display:flex;flex-direction:column;\">\n  <div style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;margin-bottom:6px;\">Ce qu'il faudra savoir faire<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:64px;font-weight:700;margin:0 0 44px;line-height:1.1;\">🎯 Objectifs du chapitre<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:26px;max-width:1560px;\">\n    <div data-reveal=\"1\" style=\"display:flex;gap:28px;align-items:flex-start;border:2px solid rgba(107,191,171,0.35);background:rgba(107,191,171,0.07);border-radius:16px;padding:30px 36px;\">\n      <span style=\"font-family:Kalam,cursive;font-size:46px;color:#6bbfab;line-height:1;\">1<\u002Fspan>\n      <span style=\"font-size:34px;line-height:1.45;text-wrap:pretty;\">Connaître la loi de Beer-Lambert et savoir l'appliquer.<\u002Fspan>\n    <\u002Fdiv>\n    <div data-reveal=\"2\" style=\"display:flex;gap:28px;align-items:flex-start;border:2px solid rgba(107,191,171,0.35);background:rgba(107,191,171,0.07);border-radius:16px;padding:30px 36px;\">\n      <span style=\"font-family:Kalam,cursive;font-size:46px;color:#6bbfab;line-height:1;\">2<\u002Fspan>\n      <span style=\"font-size:34px;line-height:1.45;text-wrap:pretty;\">Comprendre le lien entre spectre d'absorption et couleur perçue.<\u002Fspan>\n    <\u002Fdiv>\n    <div data-reveal=\"3\" style=\"display:flex;gap:28px;align-items:flex-start;border:2px solid rgba(107,191,171,0.35);background:rgba(107,191,171,0.07);border-radius:16px;padding:30px 36px;\">\n      <span style=\"font-family:Kalam,cursive;font-size:46px;color:#6bbfab;line-height:1;\">3<\u002Fspan>\n      <span style=\"font-size:34px;line-height:1.45;text-wrap:pretty;\">Savoir exploiter une courbe d'étalonnage pour déterminer une concentration inconnue.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Accroche\" data-screen-label=\"03\" data-speaker-notes=\"Faire circuler l'idée : plus la solution est concentrée, plus elle est foncée. L'œil le voit ; le spectrophotomètre le chiffre.\" style=\"background:#16261f;background-image:linear-gradient(rgba(242,237,225,0.09) 1px,transparent 1px),linear-gradient(90deg,rgba(242,237,225,0.09) 1px,transparent 1px);background-size:96px 96px,96px 96px;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:70px 92px;display:flex;flex-direction:column;justify-content:center;gap:40px;\">\n  <div style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;\">a. L'absorbance et la loi de Beer-Lambert<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:76px;font-weight:700;margin:0;line-height:1.1;max-width:1520px;\">Plus c'est foncé, plus c'est concentré ?<\u002Fh2>\n  <div data-reveal=\"1\" style=\"display:flex;gap:22px;align-items:flex-end;\">\n    <div style=\"width:150px;height:190px;border:2px solid #c9c2b0;background:rgba(107,191,171,0.18);\"><\u002Fdiv>\n    <div style=\"width:150px;height:190px;border:2px solid #c9c2b0;background:rgba(150,160,140,0.34);\"><\u002Fdiv>\n    <div style=\"width:150px;height:190px;border:2px solid #c9c2b0;background:rgba(196,140,116,0.52);\"><\u002Fdiv>\n    <div style=\"width:150px;height:190px;border:2px solid #c9c2b0;background:rgba(217,122,99,0.72);\"><\u002Fdiv>\n    <div style=\"font-family:Kalam,cursive;font-size:40px;color:#e8c468;padding-bottom:16px;\">C augmente →<\u002Fdiv>\n  <\u002Fdiv>\n  <p data-reveal=\"2\" style=\"font-size:36px;line-height:1.5;margin:0;max-width:1500px;text-wrap:pretty;\">Une solution colorée absorbe d'autant plus la lumière qu'elle est concentrée. Si on sait mesurer cette absorption, on peut donc remonter à la concentration — sans prélèvement et sans réaction chimique.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Déf · absorbance\" data-screen-label=\"04\" data-speaker-notes=\"Bien dire : A est sans unité, et toujours donnée pour une longueur d'onde λ précisée.\" style=\"background:#16261f;background-image:linear-gradient(rgba(242,237,225,0.09) 1px,transparent 1px),linear-gradient(90deg,rgba(242,237,225,0.09) 1px,transparent 1px);background-size:96px 96px,96px 96px;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:70px 92px;display:flex;flex-direction:column;justify-content:center;gap:34px;\">\n  <div style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;\">a. L'absorbance et la loi de Beer-Lambert<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:60px;font-weight:700;margin:0;line-height:1.1;\">L'absorbance<\u002Fh2>\n  <div style=\"border:2px solid rgba(232,196,104,0.45);background:rgba(232,196,104,0.07);border-radius:16px;padding:30px 38px;max-width:1620px;\">\n    <span style=\"display:block;font-family:Kalam,cursive;font-size:26px;color:#e8c468;letter-spacing:0.06em;margin-bottom:12px;\">📘 DÉFINITION<\u002Fspan>\n    <span style=\"font-size:34px;line-height:1.45;text-wrap:pretty;\">L'<strong>absorbance<\u002Fstrong> <em>A<\u002Fem> d'une solution est une grandeur sans unité liée à la proportion de lumière absorbée par la solution, pour une longueur d'onde λ donnée. Elle se mesure à l'aide d'un <strong>spectrophotomètre<\u002Fstrong>.<\u002Fspan>\n  <\u002Fdiv>\n  <div data-reveal=\"1\" style=\"display:flex;gap:34px;align-items:stretch;max-width:1620px;\">\n    <div style=\"flex:1;border:2px solid rgba(107,191,171,0.4);background:rgba(107,191,171,0.08);border-radius:14px;padding:30px 34px;\">\n      <span style=\"display:block;font-family:Kalam,cursive;font-size:26px;color:#6bbfab;letter-spacing:0.06em;margin-bottom:12px;\">📌 À RETENIR<\u002Fspan>\n      <span style=\"font-size:32px;line-height:1.45;\">Plus <em>A<\u002Fem> est grande, plus la solution absorbe. Une solution qui n'absorbe rien à cette longueur d'onde a une absorbance <strong style=\"color:#e8c468;\">A = 0<\u002Fstrong>.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1;background:rgba(0,0,0,0.25);border:1px solid rgba(242,237,225,0.16);border-radius:14px;padding:30px 34px;display:flex;flex-direction:column;justify-content:center;gap:14px;\">\n      <div style=\"font-size:31px;line-height:1.5;color:#c9c2b0;\">Au laboratoire : on règle d'abord le <strong style=\"color:#f2ede1;\">zéro<\u002Fstrong> du spectrophotomètre avec le <strong style=\"color:#f2ede1;\">blanc<\u002Fstrong> (le solvant seul), puis on mesure la solution.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Loi de Beer-Lambert\" data-screen-label=\"05\" data-speaker-notes=\"Détailler chaque grandeur et son unité. ℓ vaut presque toujours 1,0 cm : c'est l'épaisseur d'une cuve standard.\" style=\"background:#16261f;background-image:linear-gradient(rgba(242,237,225,0.09) 1px,transparent 1px),linear-gradient(90deg,rgba(242,237,225,0.09) 1px,transparent 1px);background-size:96px 96px,96px 96px;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:64px 92px;display:flex;flex-direction:column;justify-content:center;gap:30px;\">\n  <div style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;\">a. L'absorbance et la loi de Beer-Lambert<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:60px;font-weight:700;margin:0;line-height:1.1;\">La loi de Beer-Lambert<\u002Fh2>\n  <p style=\"font-size:32px;color:#c9c2b0;margin:0;max-width:1620px;\">Pour une longueur d'onde fixée, l'absorbance d'une solution <strong style=\"color:#f2ede1;\">diluée<\u002Fstrong> est donnée par :<\u002Fp>\n  <div style=\"background:rgba(0,0,0,0.25);border:1px solid rgba(242,237,225,0.16);border-radius:14px;padding:34px;color:#e8c468;text-align:center;max-width:1620px;\">\n    <div style=\"font-size:88px;\"><em>A<\u002Fem> = ε × ℓ × <em>C<\u002Fem><\u002Fdiv>\n  <\u002Fdiv>\n  <div data-reveal=\"1\" style=\"display:flex;gap:24px;max-width:1620px;\">\n    <div style=\"flex:1;border:1px solid rgba(242,237,225,0.16);border-radius:14px;padding:24px 28px;\">\n      <div style=\"font-family:Kalam,cursive;font-size:44px;color:#e8c468;\">ε<\u002Fdiv>\n      <div style=\"font-size:29px;line-height:1.45;margin-top:8px;\">coefficient d'absorption molaire, en L·mol⁻¹·cm⁻¹ — propre à l'espèce et à la longueur d'onde<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;border:1px solid rgba(242,237,225,0.16);border-radius:14px;padding:24px 28px;\">\n      <div style=\"font-family:Kalam,cursive;font-size:44px;color:#e8c468;\">ℓ<\u002Fdiv>\n      <div style=\"font-size:29px;line-height:1.45;margin-top:8px;\">épaisseur de solution traversée par la lumière, en cm — l'épaisseur de la cuve<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;border:1px solid rgba(242,237,225,0.16);border-radius:14px;padding:24px 28px;\">\n      <div style=\"font-family:Kalam,cursive;font-size:44px;color:#e8c468;\"><em>C<\u002Fem><\u002Fdiv>\n      <div style=\"font-size:29px;line-height:1.45;margin-top:8px;\">concentration en quantité de matière de l'espèce colorée, en mol/L<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-reveal=\"2\" style=\"border:2px solid rgba(107,191,171,0.4);background:rgba(107,191,171,0.08);border-radius:14px;padding:26px 34px;max-width:1620px;\">\n    <span style=\"display:block;font-family:Kalam,cursive;font-size:26px;color:#6bbfab;letter-spacing:0.06em;margin-bottom:10px;\">📌 À RETENIR<\u002Fspan>\n    <span style=\"font-size:32px;line-height:1.45;\">Pour une solution donnée (ℓ et λ fixées), l'absorbance est <strong>proportionnelle<\u002Fstrong> à la concentration : <strong style=\"color:#e8c468;\"><em>A<\u002Fem> = k × <em>C<\u002Fem><\u002Fstrong>.<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Anim · cuve\" data-screen-label=\"06\" data-speaker-notes=\"Faire varier C : le faisceau ressort atténué et A augmente. Faire remarquer que A est bien proportionnelle à C, pas la transmittance.\" style=\"background:#16261f;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:44px 70px 34px;display:flex;flex-direction:column;\">\n  <div style=\"display:flex;align-items:baseline;gap:24px;flex-wrap:wrap;margin-bottom:10px;\">\n    <h2 style=\"font-family:Kalam,cursive;font-size:50px;font-weight:700;margin:0;\">🔬 <em>A<\u002Fem> = ε × ℓ × <em>C<\u002Fem><\u002Fh2>\n    <span style=\"font-size:26px;color:#c9c2b0;\">Faites varier la concentration : le faisceau ressort atténué, et A évolue.<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;\">\n    <div style=\"width:760px;transform:scale(2.2);transform-origin:center center;display:flex;gap:26px;align-items:center;justify-content:center;\">\n      <div style=\"width:300px;flex:none;\"><svg id=\"deckBeerSvg\" sc-camel-view-box=\"0 0 260 180\" style=\"width:100%;height:auto;display:block;\"><\u002Fsvg><\u002Fdiv>\n      <div style=\"flex:1;min-width:280px;\">\n        <label for=\"deckBeerC\" style=\"font-size:0.85rem;color:#c9c2b0;display:block;margin-top:10px;\">Concentration C (× 10⁻⁴ mol/L)<\u002Flabel>\n        <input type=\"range\" id=\"deckBeerC\" min=\"0\" max=\"70\" step=\"1\" style=\"width:100%;height:30px;\">\n        <div id=\"deckBeerReadout\" style=\"font-size:1rem;margin-top:14px;color:#c9c2b0;line-height:1.6;\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Flash · A et C\" data-screen-label=\"07\" data-speaker-notes=\"Réponse : A double. Faire justifier par la proportionnalité A = k C, à ℓ et λ fixées.\" style=\"background:#1d3229;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:70px 92px;display:flex;flex-direction:column;justify-content:center;gap:38px;\">\n  <div style=\"display:inline-flex;align-self:flex-start;font-family:Kalam,cursive;font-size:28px;color:#16261f;background:#e8c468;border-radius:999px;padding:8px 26px;letter-spacing:0.04em;\">Question flash<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:64px;font-weight:700;margin:0;line-height:1.15;max-width:1520px;text-wrap:pretty;\">Je dilue une solution deux fois. Que devient son absorbance ?<\u002Fh2>\n  <div data-reveal=\"1\" style=\"display:flex;gap:26px;flex-wrap:wrap;\">\n    <div style=\"border:2px solid #6bbfab;background:rgba(107,191,171,0.16);border-radius:14px;padding:26px 40px;font-size:36px;\">A est divisée par 2 ✅<\u002Fdiv>\n    <div style=\"border:2px dashed rgba(242,237,225,0.2);border-radius:14px;padding:26px 40px;font-size:36px;color:#c9c2b0;\">A reste la même<\u002Fdiv>\n    <div style=\"border:2px dashed rgba(242,237,225,0.2);border-radius:14px;padding:26px 40px;font-size:36px;color:#c9c2b0;\">A double<\u002Fdiv>\n  <\u002Fdiv>\n  <p data-reveal=\"2\" style=\"font-size:34px;line-height:1.5;margin:0;max-width:1500px;color:#c9c2b0;text-wrap:pretty;\">Diluer deux fois divise <em>C<\u002Fem> par 2. Comme <strong style=\"color:#e8c468;\"><em>A<\u002Fem> = k × <em>C<\u002Fem><\u002Fstrong> (ε et ℓ inchangés), l'absorbance est divisée par 2 elle aussi.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Exemple · calcul de A\" data-screen-label=\"08\" data-speaker-notes=\"Faire attention aux puissances de dix et à l'homogénéité des unités : ε en L·mol⁻¹·cm⁻¹, ℓ en cm, C en mol/L, donc A sans unité.\" style=\"background:#16261f;background-image:linear-gradient(rgba(242,237,225,0.09) 1px,transparent 1px),linear-gradient(90deg,rgba(242,237,225,0.09) 1px,transparent 1px);background-size:96px 96px,96px 96px;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:70px 92px;display:flex;flex-direction:column;justify-content:center;gap:34px;\">\n  <div style=\"display:inline-flex;align-self:flex-start;font-family:Kalam,cursive;font-size:28px;color:#16261f;background:#6bbfab;border-radius:999px;padding:8px 26px;letter-spacing:0.04em;\">Application<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:58px;font-weight:700;margin:0;line-height:1.15;max-width:1620px;text-wrap:pretty;\">Quelle est l'absorbance d'une solution de concentration <em>C<\u002Fem> = 4,0 × 10⁻⁴ mol/L ?<\u002Fh2>\n  <p style=\"font-size:30px;color:#c9c2b0;margin:0;\">Données : ε = 1700 L·mol⁻¹·cm⁻¹ · ℓ = 1,0 cm<\u002Fp>\n  <div style=\"display:flex;flex-direction:column;gap:20px;max-width:1620px;\">\n    <div data-reveal=\"1\" style=\"font-size:38px;padding:22px 32px;border-left:5px solid #6bbfab;background:rgba(107,191,171,0.07);\"><em>A<\u002Fem> = ε × ℓ × <em>C<\u002Fem><\u002Fdiv>\n    <div data-reveal=\"2\" style=\"font-size:38px;padding:22px 32px;border-left:5px solid #6bbfab;background:rgba(107,191,171,0.07);\"><em>A<\u002Fem> = 1700 × 1,0 × 4,0 × 10⁻⁴<\u002Fdiv>\n    <div data-reveal=\"3\" style=\"font-size:46px;padding:26px 32px;border-left:5px solid #e8c468;background:rgba(232,196,104,0.10);color:#e8c468;\"><em>A<\u002Fem> = <strong>0,68<\u002Fstrong> (sans unité)<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"§ Spectroscopie\" data-screen-label=\"09\" data-speaker-notes=\"Transition : jusqu'ici λ était fixée. On la fait maintenant varier.\" style=\"background:#1d3229;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:70px 92px;display:flex;flex-direction:column;justify-content:center;gap:22px;\">\n  <div style=\"font-family:Kalam,cursive;font-size:190px;color:rgba(232,196,104,0.22);line-height:0.9;\">b<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:82px;font-weight:700;margin:0;line-height:1.1;\">La spectroscopie UV-visible<\u002Fh2>\n  <p style=\"font-size:36px;color:#c9c2b0;margin:0;max-width:1300px;\">Balayer les longueurs d'onde, et comprendre pourquoi une solution a cette couleur-là.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Déf · spectre\" data-screen-label=\"10\" data-speaker-notes=\"Le maximum d'absorption λmax est la longueur d'onde à laquelle on travaillera pour le dosage : c'est là que la mesure est la plus sensible.\" style=\"background:#16261f;background-image:linear-gradient(rgba(242,237,225,0.09) 1px,transparent 1px),linear-gradient(90deg,rgba(242,237,225,0.09) 1px,transparent 1px);background-size:96px 96px,96px 96px;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:70px 92px;display:flex;flex-direction:column;justify-content:center;gap:34px;\">\n  <div style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;\">b. La spectroscopie UV-visible<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:60px;font-weight:700;margin:0;line-height:1.1;\">Le spectre d'absorption<\u002Fh2>\n  <div style=\"border:2px solid rgba(232,196,104,0.45);background:rgba(232,196,104,0.07);border-radius:16px;padding:30px 38px;max-width:1620px;\">\n    <span style=\"display:block;font-family:Kalam,cursive;font-size:26px;color:#e8c468;letter-spacing:0.06em;margin-bottom:12px;\">📘 DÉFINITION<\u002Fspan>\n    <span style=\"font-size:34px;line-height:1.45;text-wrap:pretty;\">Le spectrophotomètre permet de tracer le <strong>spectre d'absorption<\u002Fstrong> d'une solution, c'est-à-dire le graphe de l'absorbance en fonction de la longueur d'onde.<\u002Fspan>\n  <\u002Fdiv>\n  <div data-reveal=\"1\" style=\"display:flex;gap:34px;align-items:stretch;max-width:1620px;\">\n    <div style=\"flex:1;background:rgba(0,0,0,0.25);border:1px solid rgba(242,237,225,0.16);border-radius:14px;padding:28px 34px;display:flex;flex-direction:column;justify-content:center;gap:16px;\">\n      <div style=\"font-family:Kalam,cursive;font-size:36px;color:#e8c468;\">A = f(λ)<\u002Fdiv>\n      <div style=\"font-size:30px;color:#c9c2b0;line-height:1.45;\">En abscisse la longueur d'onde λ (en nm), en ordonnée l'absorbance A.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1.4;border:2px solid rgba(107,191,171,0.4);background:rgba(107,191,171,0.08);border-radius:14px;padding:28px 34px;display:flex;flex-direction:column;justify-content:center;\">\n      <span style=\"display:block;font-family:Kalam,cursive;font-size:26px;color:#6bbfab;letter-spacing:0.06em;margin-bottom:12px;\">📌 À RETENIR<\u002Fspan>\n      <span style=\"font-size:32px;line-height:1.45;\">Un <strong>maximum d'absorption<\u002Fstrong> dans le domaine visible indique la présence d'une <strong>espèce colorée<\u002Fstrong> dans la solution. C'est à cette longueur d'onde λ<sub>max<\u002Fsub> qu'on effectuera les mesures.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Couleur complémentaire\" data-screen-label=\"11\" data-speaker-notes=\"Faire le lien avec l'accroche : le permanganate absorbe vers 520 nm (vert) et apparaît violet. Diamétralement opposé sur le cercle.\" style=\"background:#16261f;background-image:linear-gradient(rgba(242,237,225,0.09) 1px,transparent 1px),linear-gradient(90deg,rgba(242,237,225,0.09) 1px,transparent 1px);background-size:96px 96px,96px 96px;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:64px 92px;display:flex;flex-direction:column;gap:26px;\">\n  <div style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;\">b. La spectroscopie UV-visible<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:60px;font-weight:700;margin:0;line-height:1.1;\">La couleur perçue est la couleur complémentaire<\u002Fh2>\n  <div style=\"flex:1;display:flex;gap:56px;align-items:center;\">\n    <div style=\"flex:none;width:420px;height:420px;border-radius:50%;background:conic-gradient(#d94f4f,#d9924f,#e8c468,#b9d15c,#6bbfab,#5cb3d1,#5c73d1,#8f5cd1,#d15ca0,#d94f4f);position:relative;display:flex;align-items:center;justify-content:center;\">\n      <div style=\"width:190px;height:190px;border-radius:50%;background:#16261f;\"><\u002Fdiv>\n      <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;\">\n        <div style=\"width:340px;height:3px;background:#f2ede1;transform:rotate(-24deg);\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;gap:24px;\">\n      <p style=\"font-size:34px;line-height:1.5;margin:0;text-wrap:pretty;\">La couleur perçue est la couleur <strong>complémentaire<\u002Fstrong> de celle qui est absorbée — on la détermine à l'aide du <strong>cercle chromatique<\u002Fstrong> : deux couleurs complémentaires y sont diamétralement opposées.<\u002Fp>\n      <div data-reveal=\"1\" style=\"border:1px solid rgba(242,237,225,0.16);background:rgba(0,0,0,0.22);border-radius:14px;padding:26px 32px;display:flex;flex-direction:column;gap:14px;\">\n        <div style=\"font-size:30px;color:#c9c2b0;\">Exemple — une solution de permanganate de potassium<\u002Fdiv>\n        <div style=\"font-size:34px;line-height:1.5;\">absorbe le <strong style=\"color:#b9d15c;\">vert<\u002Fstrong> (λ<sub>max<\u002Fsub> ≈ 520 nm) &nbsp;→&nbsp; elle apparaît <strong style=\"color:#c58fe0;\">violette<\u002Fstrong>.<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"2\" style=\"border:2px solid rgba(217,122,99,0.45);background:rgba(217,122,99,0.08);border-radius:14px;padding:24px 32px;\">\n        <span style=\"display:block;font-family:Kalam,cursive;font-size:25px;color:#d97a63;letter-spacing:0.06em;margin-bottom:8px;\">⚠️ ATTENTION<\u002Fspan>\n        <span style=\"font-size:31px;line-height:1.4;\">La couleur qu'on voit n'est <strong>pas<\u002Fstrong> celle qui est absorbée : c'est ce qui reste de la lumière blanche après absorption.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"§ Étalonnage\" data-screen-label=\"12\" data-speaker-notes=\"Annoncer : c'est le protocole du TP. Cinq étapes à connaître.\" style=\"background:#1d3229;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:70px 92px;display:flex;flex-direction:column;justify-content:center;gap:22px;\">\n  <div style=\"font-family:Kalam,cursive;font-size:190px;color:rgba(232,196,104,0.22);line-height:0.9;\">c<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:82px;font-weight:700;margin:0;line-height:1.1;\">Le dosage par étalonnage<\u002Fh2>\n  <p style=\"font-size:36px;color:#c9c2b0;margin:0;max-width:1300px;\">Comparer l'inconnue à des solutions dont on connaît la concentration.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Déf · dosage\" data-screen-label=\"13\" data-speaker-notes=\"Insister sur « comparer » : on ne calcule pas C directement, on la lit sur une droite construite avec des étalons.\" style=\"background:#16261f;background-image:linear-gradient(rgba(242,237,225,0.09) 1px,transparent 1px),linear-gradient(90deg,rgba(242,237,225,0.09) 1px,transparent 1px);background-size:96px 96px,96px 96px;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:70px 92px;display:flex;flex-direction:column;justify-content:center;gap:34px;\">\n  <div style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;\">c. Le dosage par étalonnage<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:60px;font-weight:700;margin:0;line-height:1.1;\">Doser, c'est comparer<\u002Fh2>\n  <div style=\"border:2px solid rgba(232,196,104,0.45);background:rgba(232,196,104,0.07);border-radius:16px;padding:30px 38px;max-width:1620px;\">\n    <span style=\"display:block;font-family:Kalam,cursive;font-size:26px;color:#e8c468;letter-spacing:0.06em;margin-bottom:12px;\">📘 DÉFINITION<\u002Fspan>\n    <span style=\"font-size:34px;line-height:1.45;text-wrap:pretty;\">Un <strong>dosage par étalonnage<\u002Fstrong> consiste à déterminer la concentration d'une espèce chimique dans une solution en comparant une grandeur physique (par exemple l'absorbance) à celles de <strong>solutions étalons<\u002Fstrong> de concentration connue.<\u002Fspan>\n  <\u002Fdiv>\n  <div data-reveal=\"1\" style=\"border:2px solid rgba(107,191,171,0.4);background:rgba(107,191,171,0.08);border-radius:14px;padding:28px 34px;max-width:1620px;\">\n    <span style=\"display:block;font-family:Kalam,cursive;font-size:26px;color:#6bbfab;letter-spacing:0.06em;margin-bottom:12px;\">📌 À RETENIR<\u002Fspan>\n    <span style=\"font-size:32px;line-height:1.45;\">La courbe d'étalonnage <em>A<\u002Fem> = f(<em>C<\u002Fem>) est une <strong>droite qui passe par l'origine<\u002Fstrong> : sans soluté (<em>C<\u002Fem> = 0), il n'y a rien à absorber, donc <strong style=\"color:#e8c468;\">A = 0<\u002Fstrong>.<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Méthode · 5 étapes\" data-screen-label=\"14\" data-speaker-notes=\"Faire noter les cinq étapes. Rappeler la dilution du chapitre 1 pour l'étape 1.\" style=\"background:#16261f;background-image:linear-gradient(rgba(242,237,225,0.09) 1px,transparent 1px),linear-gradient(90deg,rgba(242,237,225,0.09) 1px,transparent 1px);background-size:96px 96px,96px 96px;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:64px 92px;display:flex;flex-direction:column;\">\n  <div style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;margin-bottom:6px;\">c. Le dosage par étalonnage<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:60px;font-weight:700;margin:0 0 36px;line-height:1.1;\">🔧 La méthode, en cinq étapes<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:18px;max-width:1660px;\">\n    <div data-reveal=\"1\" style=\"display:flex;gap:26px;align-items:center;border-left:5px solid #6bbfab;background:rgba(107,191,171,0.07);padding:22px 30px;\">\n      <span style=\"font-family:Kalam,cursive;font-size:44px;color:#6bbfab;line-height:1;flex:none;width:44px;\">1<\u002Fspan>\n      <span style=\"font-size:34px;line-height:1.4;\">Préparer une gamme de solutions étalons par <strong>dilution<\u002Fstrong> à partir d'une solution mère.<\u002Fspan>\n    <\u002Fdiv>\n    <div data-reveal=\"2\" style=\"display:flex;gap:26px;align-items:center;border-left:5px solid #6bbfab;background:rgba(107,191,171,0.07);padding:22px 30px;\">\n      <span style=\"font-family:Kalam,cursive;font-size:44px;color:#6bbfab;line-height:1;flex:none;width:44px;\">2<\u002Fspan>\n      <span style=\"font-size:34px;line-height:1.4;\">Mesurer l'absorbance de chaque solution étalon.<\u002Fspan>\n    <\u002Fdiv>\n    <div data-reveal=\"3\" style=\"display:flex;gap:26px;align-items:center;border-left:5px solid #6bbfab;background:rgba(107,191,171,0.07);padding:22px 30px;\">\n      <span style=\"font-family:Kalam,cursive;font-size:44px;color:#6bbfab;line-height:1;flex:none;width:44px;\">3<\u002Fspan>\n      <span style=\"font-size:34px;line-height:1.4;\">Tracer la courbe d'étalonnage <em>A<\u002Fem> = f(<em>C<\u002Fem>) — une droite qui passe par l'origine.<\u002Fspan>\n    <\u002Fdiv>\n    <div data-reveal=\"4\" style=\"display:flex;gap:26px;align-items:center;border-left:5px solid #6bbfab;background:rgba(107,191,171,0.07);padding:22px 30px;\">\n      <span style=\"font-family:Kalam,cursive;font-size:44px;color:#6bbfab;line-height:1;flex:none;width:44px;\">4<\u002Fspan>\n      <span style=\"font-size:34px;line-height:1.4;\">Mesurer l'absorbance de la solution inconnue.<\u002Fspan>\n    <\u002Fdiv>\n    <div data-reveal=\"5\" style=\"display:flex;gap:26px;align-items:center;border-left:5px solid #e8c468;background:rgba(232,196,104,0.10);padding:22px 30px;\">\n      <span style=\"font-family:Kalam,cursive;font-size:44px;color:#e8c468;line-height:1;flex:none;width:44px;\">5<\u002Fspan>\n      <span style=\"font-size:34px;line-height:1.4;color:#e8c468;\">Lire graphiquement sa concentration sur la courbe.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Anim · courbe d'étalonnage\" data-screen-label=\"15\" data-speaker-notes=\"Déplacer le curseur A mesurée : montrer le tracé horizontal jusqu'à la droite, puis vertical jusqu'à l'axe des concentrations.\" style=\"background:#16261f;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:44px 70px 34px;display:flex;flex-direction:column;\">\n  <div style=\"display:flex;align-items:baseline;gap:24px;flex-wrap:wrap;margin-bottom:10px;\">\n    <h2 style=\"font-family:Kalam,cursive;font-size:50px;font-weight:700;margin:0;\">📈 Lire une concentration inconnue<\u002Fh2>\n    <span style=\"font-size:26px;color:#c9c2b0;\">Déplacez le curseur « A mesurée » : les pointillés montrent la lecture graphique.<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;\">\n    <div style=\"width:800px;transform:scale(2.05);transform-origin:center center;display:flex;gap:26px;align-items:center;justify-content:center;\">\n      <div style=\"width:320px;flex:none;\"><svg id=\"deckCalibSvg\" sc-camel-view-box=\"0 0 260 205\" style=\"width:100%;height:auto;display:block;\"><\u002Fsvg><\u002Fdiv>\n      <div style=\"flex:1;min-width:300px;\">\n        <label for=\"deckCalibA\" style=\"font-size:0.85rem;color:#c9c2b0;display:block;margin-top:10px;\">Absorbance mesurée A<\u002Flabel>\n        <input type=\"range\" id=\"deckCalibA\" min=\"0\" max=\"130\" step=\"1\" style=\"width:100%;height:30px;\">\n        <div id=\"deckCalibReadout\" style=\"font-size:1rem;margin-top:14px;color:#c9c2b0;line-height:1.6;\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Limite du modèle\" data-screen-label=\"16\" data-speaker-notes=\"Expliquer pourquoi on dilue toujours avant de mesurer : rester dans le domaine de linéarité.\" style=\"background:#16261f;background-image:linear-gradient(rgba(242,237,225,0.09) 1px,transparent 1px),linear-gradient(90deg,rgba(242,237,225,0.09) 1px,transparent 1px);background-size:96px 96px,96px 96px;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:70px 92px;display:flex;flex-direction:column;justify-content:center;gap:34px;\">\n  <div style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;\">c. Le dosage par étalonnage<\u002Fdiv>\n  <h2 style=\"font-family:Kalam,cursive;font-size:60px;font-weight:700;margin:0;line-height:1.1;\">Jusqu'où la loi est-elle valable ?<\u002Fh2>\n  <div style=\"border:2px solid rgba(217,122,99,0.45);background:rgba(217,122,99,0.08);border-radius:16px;padding:30px 38px;max-width:1620px;\">\n    <span style=\"display:block;font-family:Kalam,cursive;font-size:26px;color:#d97a63;letter-spacing:0.06em;margin-bottom:12px;\">⚠️ ATTENTION — LIMITE DU MODÈLE<\u002Fspan>\n    <span style=\"font-size:34px;line-height:1.45;text-wrap:pretty;\">Pour des solutions <strong>trop concentrées<\u002Fstrong>, la loi de Beer-Lambert ne s'applique plus : <em>A<\u002Fem> et <em>C<\u002Fem> ne sont plus proportionnelles — on sort du <strong>domaine de linéarité<\u002Fstrong>.<\u002Fspan>\n  <\u002Fdiv>\n  <div data-reveal=\"1\" style=\"display:flex;gap:34px;align-items:stretch;max-width:1620px;\">\n    <div style=\"flex:1;border:1px solid rgba(242,237,225,0.16);background:rgba(0,0,0,0.22);border-radius:14px;padding:26px 32px;\">\n      <div style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;margin-bottom:10px;\">Domaine de validité<\u002Fdiv>\n      <div style=\"font-size:31px;line-height:1.45;\">La droite d'étalonnage n'est droite que pour des solutions <strong>diluées<\u002Fstrong>. Au-delà, la courbe s'infléchit.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;border:1px solid rgba(242,237,225,0.16);background:rgba(0,0,0,0.22);border-radius:14px;padding:26px 32px;\">\n      <div style=\"font-family:Kalam,cursive;font-size:30px;color:#6bbfab;margin-bottom:10px;\">En pratique<\u002Fdiv>\n      <div style=\"font-size:31px;line-height:1.45;\">Si <em>A<\u002Fem> est trop grande, on <strong>dilue<\u002Fstrong> la solution d'un facteur connu, on mesure, puis on remonte à la concentration de départ.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Récapitulatif\" data-screen-label=\"17\" data-speaker-notes=\"Diapo à photographier. Les deux relations et les cinq étapes : tout le chapitre tient là.\" style=\"background:#16261f;background-image:linear-gradient(rgba(242,237,225,0.09) 1px,transparent 1px),linear-gradient(90deg,rgba(242,237,225,0.09) 1px,transparent 1px);background-size:96px 96px,96px 96px;color:#f2ede1;font-family:'Space Grotesk',sans-serif;padding:56px 80px;display:flex;flex-direction:column;\">\n  <h2 style=\"font-family:Kalam,cursive;font-size:58px;font-weight:700;margin:0 0 30px;line-height:1.1;\">🗂️ L'essentiel du chapitre<\u002Fh2>\n  <div style=\"flex:1;display:grid;grid-template-columns:1fr 1fr;gap:24px;\">\n    <div style=\"display:flex;flex-direction:column;gap:24px;\">\n      <div style=\"flex:1;border:1px solid rgba(242,237,225,0.16);background:rgba(0,0,0,0.2);border-radius:14px;padding:26px 32px;display:flex;flex-direction:column;justify-content:center;gap:10px;\">\n        <div style=\"font-size:25px;color:#6bbfab;font-family:Kalam,cursive;\">Loi de Beer-Lambert<\u002Fdiv>\n        <div style=\"font-size:52px;color:#e8c468;\"><em>A<\u002Fem> = ε × ℓ × <em>C<\u002Fem><\u002Fdiv>\n        <div style=\"font-size:23px;color:#c9c2b0;\">A sans unité · ε (L·mol⁻¹·cm⁻¹) · ℓ (cm) · C (mol/L)<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;border:2px solid rgba(232,196,104,0.4);background:rgba(232,196,104,0.07);border-radius:14px;padding:26px 32px;display:flex;flex-direction:column;justify-content:center;gap:10px;\">\n        <div style=\"font-size:25px;color:#6bbfab;font-family:Kalam,cursive;\">Dosage par étalonnage<\u002Fdiv>\n        <div style=\"font-size:46px;color:#e8c468;\"><em>A<\u002Fem> = k × <em>C<\u002Fem><\u002Fdiv>\n        <div style=\"font-size:23px;color:#c9c2b0;\">droite passant par l'origine — lecture graphique de C inconnue<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;border:1px solid rgba(242,237,225,0.16);background:rgba(0,0,0,0.2);border-radius:14px;padding:26px 32px;display:flex;flex-direction:column;justify-content:center;gap:10px;\">\n        <div style=\"font-size:25px;color:#6bbfab;font-family:Kalam,cursive;\">Couleur perçue<\u002Fdiv>\n        <div style=\"font-size:34px;color:#e8c468;\">complémentaire de la couleur absorbée<\u002Fdiv>\n        <div style=\"font-size:23px;color:#c9c2b0;\">λ<sub>max<\u002Fsub> lue sur le spectre d'absorption · cercle chromatique<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid rgba(242,237,225,0.16);background:rgba(0,0,0,0.2);border-radius:14px;padding:30px 36px;display:flex;flex-direction:column;justify-content:center;gap:18px;\">\n      <div style=\"font-family:Kalam,cursive;font-size:32px;color:#6bbfab;\">Les cinq étapes du dosage<\u002Fdiv>\n      <div style=\"font-size:30px;line-height:1.4;display:flex;gap:18px;\"><span style=\"font-family:Kalam,cursive;color:#e8c468;\">1<\u002Fspan><span>Préparer une gamme d'étalons par dilution<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:30px;line-height:1.4;display:flex;gap:18px;\"><span style=\"font-family:Kalam,cursive;color:#e8c468;\">2<\u002Fspan><span>Mesurer l'absorbance de chaque étalon<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:30px;line-height:1.4;display:flex;gap:18px;\"><span style=\"font-family:Kalam,cursive;color:#e8c468;\">3<\u002Fspan><span>Tracer A = f(C) : droite par l'origine<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:30px;line-height:1.4;display:flex;gap:18px;\"><span style=\"font-family:Kalam,cursive;color:#e8c468;\">4<\u002Fspan><span>Mesurer l'absorbance de l'inconnue<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:30px;line-height:1.4;display:flex;gap:18px;\"><span style=\"font-family:Kalam,cursive;color:#e8c468;\">5<\u002Fspan><span>Lire graphiquement sa concentration<\u002Fspan><\u002Fdiv>\n      <div style=\"margin-top:8px;border-top:1px solid rgba(242,237,225,0.16);padding-top:18px;font-size:27px;color:#d97a63;line-height:1.4;\">⚠️ Solutions trop concentrées : hors du domaine de linéarité — diluer avant de mesurer.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this.armReveals();\n    this.waitForSlides(0);\n  }\n\n  /* ---- Révélation progressive : les éléments [data-reveal] apparaissent\n     à la flèche droite / espace, avant de changer de diapo. Masqués par JS\n     (et non en inline) pour que tout reste visible si le script échoue. ---- */\n  armReveals() {\n    document.querySelectorAll(\"[data-reveal]\").forEach((el) => {\n      el.style.opacity = \"0\";\n      el.style.transform = \"translateY(10px)\";\n      el.style.transition = \"opacity .32s ease, transform .32s ease\";\n    });\n    if (this._revealBound) return;\n    this._revealBound = true;\n    window.addEventListener(\"keydown\", this.onRevealKey.bind(this), true);\n  }\n\n  onRevealKey(e) {\n    const t = e.composedPath ? e.composedPath()[0] : e.target;\n    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;\n    if (e.metaKey || e.ctrlKey || e.altKey) return;\n    const fwd = [\"ArrowRight\", \"PageDown\", \" \", \"Spacebar\", \"ArrowDown\"].indexOf(e.key) > -1;\n    const back = [\"ArrowLeft\", \"PageUp\", \"ArrowUp\"].indexOf(e.key) > -1;\n    if (!fwd && !back) return;\n\n    const slide = document.querySelector(\"[data-deck-active]\");\n    if (!slide) return;\n    const items = Array.prototype.slice.call(slide.querySelectorAll(\"[data-reveal]\"));\n    if (!items.length) return;\n\n    const group = (el) => el.getAttribute(\"data-reveal\");\n    const shown = (el) => el.getAttribute(\"data-revealed\") === \"1\";\n\n    if (fwd) {\n      const next = items.filter((el) => !shown(el))[0];\n      if (!next) return;\n      const g = group(next);\n      items.filter((el) => group(el) === g).forEach((el) => {\n        el.setAttribute(\"data-revealed\", \"1\");\n        el.style.opacity = \"1\";\n        el.style.transform = \"none\";\n      });\n    } else {\n      const on = items.filter(shown);\n      if (!on.length) return;\n      const g = group(on[on.length - 1]);\n      items.filter((el) => group(el) === g).forEach((el) => {\n        el.removeAttribute(\"data-revealed\");\n        el.style.opacity = \"0\";\n        el.style.transform = \"translateY(10px)\";\n      });\n    }\n    e.preventDefault();\n    e.stopImmediatePropagation();\n  }\n\n  /* Les diapos sont montées par <deck-stage> après le chargement de son\n     script : on attend que le DOM et les fonctions d'animation soient prêts. */\n  waitForSlides(tries) {\n    const ready = document.getElementById(\"deckBeerSvg\")\n      && document.getElementById(\"deckCalibSvg\")\n      && typeof window.initBeerLambert === \"function\"\n      && typeof window.initCalibrationCurve === \"function\";\n    if (ready) { this.initAnimations(); this.armReveals(); return; }\n    if (tries > 400) return;\n    requestAnimationFrame(() => this.waitForSlides(tries + 1));\n  }\n\n  initAnimations() {\n    if (this._animsDone) return;\n    this._animsDone = true;\n    /* Valeurs initiales posées directement sur le DOM : un attribut `value`\n       dans le gabarit ferait de chaque curseur un champ contrôlé par React. */\n    const start = { deckBeerC: 30, deckCalibA: 70 };\n    Object.keys(start).forEach((id) => {\n      const el = document.getElementById(id);\n      if (el) el.value = start[id];\n    });\n    initBeerLambert({ svgId: \"deckBeerSvg\", cRangeId: \"deckBeerC\", readoutId: \"deckBeerReadout\" });\n    initCalibrationCurve({ svgId: \"deckCalibSvg\", sliderId: \"deckCalibA\", readoutId: \"deckCalibReadout\" });\n  }\n\n  renderVals() { return {}; }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
